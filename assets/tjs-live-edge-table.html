<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TJ's live-edge table · schematic</title>
<style>
  :root { --bg:#f4efe6; --ink:#3d2a14; --muted:#6a5844; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:Georgia, serif; }
  .wrap { max-width:920px; margin:0 auto; padding:28px 18px 80px; }
  h1 { font-size:28px; margin-bottom:6px; }
  p { color:var(--muted); font-size:15px; margin-bottom:18px; }
  img { width:100%; display:block; border-radius:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>TJ's live-edge table</h1>
    <p>Schematic. Dark live-edge slab rim. Light 16–24&quot; log ends in the field. Center stamp log. Inverted truss bases.</p>
    <img src="tjs-live-edge-table.png" alt="TJ's live-edge table schematic">
    <p style="margin-top:22px">Beauty still (first pass — bases still busier than the pen):</p>
    <img src="tjs-live-edge-table-render.jpg" alt="TJ's live-edge table render">
    <p style="margin-top:22px">Center field reference (wall):</p>
    <img src="tjs-live-edge-wall-ref.jpg" alt="Freebird end-grain wall reference">
  </div>
</body>
</html>
