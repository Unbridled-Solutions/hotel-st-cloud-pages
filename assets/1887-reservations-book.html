<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1887 reservations book</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #191d23;
      --cream: #fff8dd;
      --gold: #b79f36;
      --taupe: #786f5c;
      --rust: #6e2c2c;
      --muted: #5c5648;
      --paper: #fffcf2;
      --font: Aptos, "Aptos Display", "Source Sans 3", Calibri, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--navy);
      font-family: var(--font);
      font-size: 17px;
      font-weight: 400;
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: var(--cream);
      padding: 14px 16px 12px;
      position: sticky; top: 0; z-index: 5;
    }
    header h1 { font-family: var(--font); font-size: 22px; font-weight: 700; }
    header .sub { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; margin-bottom: 8px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .bar input, .bar button {
      font: inherit; min-height: 44px; padding: 8px 10px;
    }
    .bar input[type="date"] {
      background: #15202e; color: var(--cream); border: 1px solid rgba(228,226,217,.25);
    }
    .bar input[type="search"] {
      flex: 1 1 280px;
      min-width: min(100%, 280px);
      background: #15202e; color: var(--cream); border: 1px solid rgba(228,226,217,.25);
    }
    .bar button {
      background: var(--gold); color: var(--navy); border: none; font-weight: 600; cursor: pointer; padding: 8px 14px;
    }
    .totals { margin-top: 8px; font-size: 14px; }
    .ticker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .ticker a, .ticker .tile {
      display: block;
      text-decoration: none;
      color: var(--cream);
      background: #12151a;
      border: 1px solid rgba(183,159,54,.35);
      padding: 10px 10px 8px;
      text-align: center;
    }
    .ticker .n {
      font-family: var(--font);
      font-size: clamp(28px, 6vw, 36px);
      line-height: 1;
      color: var(--gold);
      font-weight: 700;
    }
    .ticker .l {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: 4px;
      color: rgba(255,248,221,.75);
    }
    .ticker .p { font-size: 12px; color: rgba(255,248,221,.55); margin-top: 2px; }
    main { max-width: 820px; margin: 0 auto; padding: 12px 12px 90px; }
    .meal { margin: 14px 0 22px; scroll-margin-top: 210px; }
    .meal.quiet h2 { opacity: .55; }
    .meal h2 {
      font-family: var(--font); font-size: 22px; font-weight: 700; border-bottom: 1px solid rgba(183,159,54,.45); padding-bottom: 6px; margin-bottom: 10px;
    }
    .slot {
      display: grid;
      grid-template-columns: 7.2rem 1fr;
      gap: 12px 16px;
      align-items: start;
      background: var(--paper);
      border: 1px solid rgba(31,43,63,.12);
      margin-bottom: 10px;
      padding: 12px 14px;
    }
    .slot.hot { border-color: var(--gold); }
    .slot.full { border-color: var(--rust); }
    .slot-time {
      font-size: clamp(22px, 4.2vw, 28px);
      font-weight: 700;
      color: var(--gold);
      line-height: 1.1;
      padding-top: 2px;
    }
    .slot-body { min-width: 0; }
    .slot-h {
      display: flex;
      justify-content: flex-end;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .cov { font-size: 13px; color: var(--muted); }
    .slot.hot .cov { color: var(--gold); }
    .slot.full .cov { color: var(--rust); }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      padding: 10px 0;
      border-top: 1px solid rgba(31,43,63,.08);
      align-items: start;
    }
    .row:first-of-type { border-top: none; padding-top: 0; }
    .row b { font-weight: 700; }
    .meta { font-size: 14px; color: var(--muted); }
    .meta p { margin: 4px 0; line-height: 1.35; }
    .editbox {
      display: none;
      grid-column: 1 / -1;
      background: #fff8dd;
      border: 1px solid rgba(120,111,92,.3);
      padding: 12px;
      margin-top: 8px;
    }
    .row.editing .editbox { display: block; }
    .hist {
      display: none;
      grid-column: 1 / -1;
      font-size: 14px;
      color: var(--muted);
      padding: 8px 0 4px;
    }
    .row.show-hist .hist { display: block; }
    .hist p { margin: 6px 0; padding-left: 10px; border-left: 2px solid rgba(183,159,54,.5); }
    .hits { background: var(--paper); border: 1px solid rgba(120,111,92,.3); padding: 10px 12px; margin-bottom: 14px; }
    .hits h3 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .hit { display: block; width: 100%; text-align: left; font: inherit; background: transparent; border: none; border-bottom: 1px solid rgba(31,43,63,.08); padding: 10px 4px; cursor: pointer; color: var(--navy); }
    .hit:hover { background: rgba(183,159,54,.12); }
    .hit b { font-weight: 700; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .acts button {
      font: inherit; font-size: 13px; min-height: 36px; padding: 4px 10px;
      background: transparent; border: 1px solid rgba(31,43,63,.25); cursor: pointer; color: var(--navy);
    }
    .acts button.danger { border-color: var(--rust); color: var(--rust); }
    .add {
      display: none;
      background: var(--paper); border: 1px dashed rgba(31,43,63,.3); padding: 14px; margin: 12px 0 20px;
    }
    .add.open { display: block; }
    .toggle-add {
      width: 100%; min-height: 44px; margin: 8px 0 12px;
      background: var(--paper); border: 1px dashed rgba(120,111,92,.45);
      font: inherit; font-weight: 600; cursor: pointer; color: var(--navy);
    }
    .add h3 { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .add label { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .add input, .add textarea, .add select {
      width: 100%; font: inherit; background: transparent;
      border: none; border-bottom: 1px solid rgba(31,43,63,.3); padding: 8px 2px;
    }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; }
    .add .go {
      margin-top: 12px; min-height: 44px; width: 100%; background: var(--gold); color: var(--navy);
      border: none; font: inherit; font-weight: 600; cursor: pointer;
    }
    .err { color: var(--rust); margin-top: 8px; }
    .warn { background: #fff4e0; padding: 8px 10px; margin-top: 8px; font-size: 15px; }
    a.guest { color: var(--gold); }
    .empty { color: var(--muted); font-size: 15px; padding: 6px 0; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .slot { grid-template-columns: 5.6rem 1fr; gap: 8px 12px; }
      .slot-time { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <img src="/assets/1887-reserve/seal-cream.png" alt="" width="48" height="48" style="height:48px;width:48px" />
      <div>
        <div class="sub">1887 Historic Eatery · staff</div>
        <h1>Reservations book</h1>
      </div>
    </div>
    <div class="bar">
      <input id="date" type="date" />
      <button type="button" id="prev">Prev</button>
      <button type="button" id="next">Next</button>
      <input id="q" type="search" placeholder="Search all reservations — name, phone, notes" />
    </div>
    <div class="ticker" id="ticker"></div>
    <div class="totals" id="totals"></div>
  </header>
  <main>
    <div id="hits"></div>
    <button class="toggle-add" type="button" id="toggle-add">Add from the phone</button>
    <section class="add" id="addbox">
      <h3>Add from the phone</h3>
      <div class="grid">
        <div><label>Name</label><input id="a-name" /></div>
        <div><label>Phone</label><input id="a-phone" type="tel" /></div>
        <div><label>Party</label><input id="a-party" type="number" min="1" max="40" value="2" /></div>
        <div>
          <label>Meal / time</label>
          <input id="a-time" type="time" step="900" />
        </div>
        <div><label>Email</label><input id="a-email" type="email" /></div>
        <div><label>Taken by</label><input id="a-by" placeholder="your name" /></div>
      </div>
      <label style="margin-top:10px;display:block">Notes</label>
      <textarea id="a-notes" rows="2"></textarea>
      <label class="chk"><input type="checkbox" id="a-over" /> Manager override (over the 30 / pace caps)</label>
      <p class="warn" id="a-warn" hidden></p>
      <p class="err" id="a-err"></p>
      <button class="go" type="button" id="a-go">Save reservation</button>
      <p style="margin-top:10px;font-size:14px;color:var(--muted)">Guest link: <a class="guest" href="/assets/1887-reserve">offers.hotelstcloud.com/assets/1887-reserve</a> · Parties of 10+ stay on the phone.</p>
    </section>
    <div id="book"></div>
  </main>
  <script>
    const API = "/api/1887-reservations";
    let data = null;
    let searchHits = [];
    let searchTimer = null;
    const takenKey = "1887-res-taken-by";
    document.getElementById("a-by").value = localStorage.getItem(takenKey) || "";

    function todayStr() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Denver", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
    }
    function shiftDate(iso, n) {
      const [y,m,d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m-1, d));
      dt.setUTCDate(dt.getUTCDate() + n);
      return dt.toISOString().slice(0,10);
    }
    document.getElementById("date").value = todayStr();

    function findRes(id) {
      const list = (data && data.reservations) || [];
      return list.find(function (r) { return r.id === id; }) || null;
    }
    function denverStamp(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("en-US", { timeZone: "America/Denver", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      } catch (e) { return iso; }
    }

    async function load() {
      const date = document.getElementById("date").value;
      const res = await fetch(API + "?date=" + encodeURIComponent(date));
      data = await res.json();
      render();
    }

    async function runSearch(q) {
      const box = document.getElementById("hits");
      if (!q || q.length < 2) {
        searchHits = [];
        box.innerHTML = "";
        render();
        return;
      }
      const res = await fetch(API + "/search?q=" + encodeURIComponent(q));
      const out = await res.json();
      searchHits = out.results || [];
      renderHits();
      render();
    }

    function renderHits() {
      const box = document.getElementById("hits");
      const q = document.getElementById("q").value.trim();
      if (!q || q.length < 2) { box.innerHTML = ""; return; }
      if (!searchHits.length) {
        box.innerHTML = "<div class=\"hits\"><h3>All reservations</h3><p class=\"empty\">No matches.</p></div>";
        return;
      }
      box.innerHTML = "<div class=\"hits\"><h3>All reservations · " + searchHits.length + "</h3>" +
        searchHits.map(function (r) {
          return "<button type=\"button\" class=\"hit\" data-jump=\"" + r.date + "\" data-id=\"" + r.id + "\"><b>" +
            esc(r.name) + "</b> · party " + r.party + "<div class=\"meta\"><p>" +
            esc(r.prettyDate) + " · " + esc(r.prettyTime) + (r.mealLabel ? " · " + esc(r.mealLabel) : "") +
            "</p></div></button>";
        }).join("") + "</div>";
    }

    function render() {
      if (!data || !data.day) return;
      const day = data.day;
      const k = day.kitchen || {};
      const mealsMeta = [
        { id: "breakfast", label: "Breakfast", n: k.breakfast || 0 },
        { id: "lunch", label: "Lunch", n: k.lunch || 0 },
        { id: "dinner", label: "Dinner", n: k.dinner || 0 }
      ];
      document.getElementById("ticker").innerHTML =
        mealsMeta.map(function (m) {
          const parties = ((day.meals || []).find(function (x) { return x.id === m.id; }) || {}).parties || 0;
          return "<a href=\"#" + m.id + "\"><div class=\"n\">" + m.n + "</div><div class=\"l\">" + m.label + "</div><div class=\"p\">" + parties + " " + (parties === 1 ? "party" : "parties") + "</div></a>";
        }).join("") +
        "<div class=\"tile\"><div class=\"n\">" + (k.day || 0) + "</div><div class=\"l\">Day</div><div class=\"p\">kitchen total</div></div>";
      document.getElementById("totals").textContent = day.prettyDate;
      document.getElementById("book").innerHTML = day.meals.map(function (meal) {
        const slots = meal.slots.map(function (s) {
          const rows = s.rows;
          if (!rows.length) return "";
          const cls = s.covers >= 30 ? " full" : (s.covers >= 20 ? " hot" : "");
          return "<div class=\"slot" + cls + "\"><div class=\"slot-time\">" + s.label + "</div><div class=\"slot-body\"><div class=\"slot-h\"><span class=\"cov\">" + s.covers + " covers</span></div>" +
            rows.map(rowHtml).join("") + "</div></div>";
        }).join("");
        const empty = !slots;
        return "<section class=\"meal" + (empty ? " quiet" : "") + "\" id=\"" + meal.id + "\"><h2>" + meal.label + " · " + meal.covers + " covers</h2>" +
          (slots || "<div class=\"empty\">Nothing on the book for " + meal.label.toLowerCase() + ".</div>") +
          "</section>";
      }).join("");
    }

    function rowHtml(r) {
      const hist = (r.history || []).slice().reverse().map(function (h) {
        return "<p><b>" + esc(denverStamp(h.at)) + "</b> · " + esc(h.action) +
          (h.by ? " · " + esc(h.by) : "") +
          ((h.changes || []).length ? "<br>" + esc((h.changes || []).join("; ")) : "") + "</p>";
      }).join("") || "<p>No changes yet.</p>";
      return "<div class=\"row\" data-id=\"" + r.id + "\" data-date=\"" + esc(r.date || "") + "\">" +
        "<div><b>" + esc(r.name) + "</b>" +
        "<div class=\"meta\">" +
        "<p>Party of " + r.party + "</p>" +
        (r.phone ? "<p>" + esc(r.phone) + "</p>" : "") +
        (r.email ? "<p>" + esc(r.email) + "</p>" : "") +
        (r.notes ? "<p>" + esc(r.notes) + "</p>" : "") +
        "<p>" + (r.source === "web" ? "Booked online" : "Taken by " + esc(r.takenBy || "desk")) +
        (r.status === "noshow" ? " · no-show" : "") +
        (r.status === "cancelled" ? " · cancelled" : "") + "</p>" +
        "</div></div>" +
        "<div class=\"acts\">" +
        "<button type=\"button\" data-act=\"edit\">Edit</button>" +
        "<button type=\"button\" data-act=\"history\">History</button>" +
        "<button type=\"button\" data-act=\"noshow\">No-show</button>" +
        "<button type=\"button\" class=\"danger\" data-act=\"cancel\">Cancel</button>" +
        "</div>" +
        "<div class=\"editbox\">" +
        "<div class=\"grid\">" +
        "<div><label>Name</label><input class=\"e-name\" value=\"" + esc(r.name) + "\" /></div>" +
        "<div><label>Party</label><input class=\"e-party\" type=\"number\" min=\"1\" max=\"200\" value=\"" + r.party + "\" /></div>" +
        "<div><label>Phone</label><input class=\"e-phone\" value=\"" + esc(r.phone || "") + "\" /></div>" +
        "<div><label>Email</label><input class=\"e-email\" value=\"" + esc(r.email || "") + "\" /></div>" +
        "<div><label>Time</label><input class=\"e-time\" type=\"time\" step=\"900\" value=\"" + esc(r.time || "") + "\" /></div>" +
        "<div><label>Date</label><input class=\"e-date\" type=\"date\" value=\"" + esc(r.date || "") + "\" /></div>" +
        "</div>" +
        "<label style=\"margin-top:10px;display:block\">Notes</label>" +
        "<textarea class=\"e-notes\" rows=\"2\">" + esc(r.notes || "") + "</textarea>" +
        "<label class=\"chk\"><input type=\"checkbox\" class=\"e-over\" /> Manager override</label>" +
        "<button type=\"button\" class=\"go\" data-act=\"save\" style=\"margin-top:10px;min-height:44px;width:100%;background:var(--gold);border:none;font:inherit;font-weight:700;cursor:pointer\">Save changes</button>" +
        "</div>" +
        "<div class=\"hist\">" + hist + "</div>" +
        "</div>";
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, function (c) {
        if (c === "&") return "\u0026amp;";
        if (c === "<") return "\u0026lt;";
        if (c === ">") return "\u0026gt;";
        return "\u0026quot;";
      });
    }

    document.getElementById("hits").addEventListener("click", function (e) {
      const hit = e.target.closest("[data-jump]");
      if (!hit) return;
      document.getElementById("date").value = hit.getAttribute("data-jump");
      load();
    });

    document.getElementById("book").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const row = btn.closest("[data-id]");
      const id = row.getAttribute("data-id");
      const date = row.getAttribute("data-date") || document.getElementById("date").value;
      const act = btn.getAttribute("data-act");
      if (act === "edit") {
        row.classList.toggle("editing");
        row.classList.remove("show-hist");
        return;
      }
      if (act === "history") {
        row.classList.toggle("show-hist");
        row.classList.remove("editing");
        return;
      }
      if (act === "save") {
        const by = document.getElementById("a-by").value.trim() || localStorage.getItem(takenKey) || "";
        const body = {
          date: date,
          id: id,
          action: "edit",
          name: row.querySelector(".e-name").value.trim(),
          party: parseInt(row.querySelector(".e-party").value, 10),
          phone: row.querySelector(".e-phone").value.trim(),
          email: row.querySelector(".e-email").value.trim(),
          time: row.querySelector(".e-time").value,
          newDate: row.querySelector(".e-date").value,
          notes: row.querySelector(".e-notes").value.trim(),
          override: row.querySelector(".e-over").checked,
          takenBy: by,
          silent: true
        };
        const res = await fetch(API + "/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const out = await res.json();
        if (!out.success) { alert(out.error === "full" ? "That slot is full. Check override to force it." : (out.error || "Could not save")); return; }
        if (body.newDate && body.newDate !== date) document.getElementById("date").value = body.newDate;
        load();
        return;
      }
      if (act === "cancel" && !confirm("Cancel this reservation?")) return;
      const res = await fetch(API + "/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: date, id: id, action: act, takenBy: document.getElementById("a-by").value.trim() })
      });
      const out = await res.json();
      if (!out.success) { alert(out.error || "Could not update"); return; }
      load();
    });

    document.getElementById("date").addEventListener("change", load);
    document.getElementById("prev").addEventListener("click", () => {
      document.getElementById("date").value = shiftDate(document.getElementById("date").value, -1);
      load();
    });
    document.getElementById("next").addEventListener("click", () => {
      document.getElementById("date").value = shiftDate(document.getElementById("date").value, 1);
      load();
    });
    document.getElementById("q").addEventListener("input", function () {
      const q = this.value.trim();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { runSearch(q); }, 220);
    });

    document.getElementById("a-go").addEventListener("click", async () => {
      const err = document.getElementById("a-err");
      err.textContent = "";
      const name = document.getElementById("a-name").value.trim();
      const phone = document.getElementById("a-phone").value.trim();
      const party = parseInt(document.getElementById("a-party").value, 10);
      let time = document.getElementById("a-time").value;
      const by = document.getElementById("a-by").value.trim();
      if (!name || !phone || !time || !party) { err.textContent = "Name, phone, party, and time."; return; }
      if (time.length === 5) { /* ok */ }
      localStorage.setItem(takenKey, by);
      if (party >= 10 && !document.getElementById("a-over").checked) {
        document.getElementById("a-warn").hidden = false;
        document.getElementById("a-warn").textContent = "Party of 10+ is a manager call, not a normal booking. Check override only if a manager already said yes.";
        return;
      }
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          date: document.getElementById("date").value,
          time,
          party, name, phone,
          email: document.getElementById("a-email").value.trim(),
          notes: document.getElementById("a-notes").value.trim(),
          takenBy: by,
          source: "staff",
          override: document.getElementById("a-over").checked
        })
      });
      const out = await res.json();
      if (!out.success) {
        if (out.error === "full") {
          document.getElementById("a-warn").hidden = false;
          document.getElementById("a-warn").textContent = "That slot is at the online cap (30 covers / 45 in 30 min). Ask a manager, then check override to take it anyway.";
        }
        err.textContent = out.error === "full" ? "" : (out.error || "Could not save");
        return;
      }
      document.getElementById("a-name").value = "";
      document.getElementById("a-phone").value = "";
      document.getElementById("a-email").value = "";
      document.getElementById("a-notes").value = "";
      document.getElementById("a-over").checked = false;
      document.getElementById("a-warn").hidden = true;
      load();
    });

    document.getElementById("toggle-add").addEventListener("click", function () {
      const box = document.getElementById("addbox");
      box.classList.toggle("open");
      this.textContent = box.classList.contains("open") ? "Hide phone add" : "Add from the phone";
    });

    load().catch(() => { document.getElementById("totals").textContent = "Could not load the book."; });
  </script>
</body>
</html>
