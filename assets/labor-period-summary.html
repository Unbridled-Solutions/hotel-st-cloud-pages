<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Period Labor and Supply Summary — Unbridled Hospitality</title>
<style>
:root {
  --bg: #0f1923; --navy: #1a2e3b; --navy2: #162636; --card: #162433;
  --gold: #c9aa7c; --blue: #5a8ba7; --text: #e8e0d4; --muted: #8a9aaa;
  --border: rgba(90,139,167,0.22); --green: #4caf7d; --red: #e05a5a;
  --orange: #f97316;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
.header { background: linear-gradient(135deg, var(--navy) 0%, #0f1923 100%); border-bottom: 2px solid var(--gold); padding: 16px 22px 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.eyebrow { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
h1 { font-size: 20px; font-weight: 700; }
.hdr-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hdr-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 7px 14px; cursor: pointer; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.hdr-btn:hover { border-color: var(--gold); color: var(--gold); }
.week-nav { background: var(--navy); border-bottom: 1px solid var(--border); padding: 9px 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.week-nav label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.week-nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--gold); border-radius: 5px; font-size: 18px; font-weight: 700; padding: 2px 10px; cursor: pointer; }
.period-chip { background: rgba(90,139,167,0.15); border: 1px solid rgba(90,139,167,0.4); color: var(--blue); border-radius: 5px; font-size: 11px; font-weight: 700; padding: 3px 10px; }
.tax-chip { background: rgba(201,170,124,0.1); border: 1px solid rgba(201,170,124,0.3); color: var(--gold); border-radius: 5px; font-size: 11px; font-weight: 700; padding: 3px 10px; }
.range { font-size: 13px; color: var(--gold); font-weight: 600; }
.grain { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.grain button { background: var(--card); border: none; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; padding: 6px 14px; cursor: pointer; }
.grain button.active { background: var(--gold); color: #0f1923; }
.period-sel { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 5px; font-size: 12px; font-weight: 600; padding: 5px 8px; }
.tabs { display: flex; gap: 0; padding: 0 22px; background: #0d1620; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 12px 16px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.wrap { padding: 12px 10px 40px; max-width: none; margin: 0 auto; }
.note { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
.note a { color: var(--blue); }
.grid { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #0d1620; color: var(--blue); font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; text-align: center; padding: 6px 4px; border-bottom: 1px solid var(--border); }
th.left { text-align: center; }
td { padding: 4px 4px; text-align: right; border-bottom: 1px solid rgba(90,139,167,0.12); color: var(--text); background: var(--card); }
td.left { text-align: left; color: var(--white, #f5f5f5); font-weight: 600; }
tr.total td { background: #0d1620; color: var(--gold); font-weight: 700; border-top: 1px solid var(--gold); }
tr.forecast td { background: #1c3344; color: #b7d0de; font-weight: 700; border-top: 1px solid rgba(90,139,167,0.55); }
tr.forecast td.sticky { background: #1c3344; color: #d5e6ef; border-right: 3px solid #c9aa7c; }
tr.vs td { background: #15222c; color: var(--text); font-weight: 700; }
tr.vs td.sticky { background: #15222c; border-right: 3px solid #c9aa7c; }
tr.blank td { color: var(--muted); font-style: italic; }
tr.week-tot td { background: #4a5560; color: #e8e0d4; font-weight: 700; border-top: 1px solid rgba(138,154,170,0.45); border-bottom: 1px solid rgba(138,154,170,0.45); }
tr.week-tot td.sticky { background: #4a5560; color: #e8e0d4; border-right: 3px solid #c9aa7c; }
tr.week-tot .pct-hi { color: var(--red); }
tr.week-tot .pct-ok { color: var(--green); }
th.grp { text-align: center; color: var(--gold); letter-spacing: 1px; border-left: 3px solid #c9aa7c; font-size: 10px; }
th.grp-plain { text-align: center; color: var(--gold); letter-spacing: 1px; font-size: 10px; }
th.sub { font-size: 8px; letter-spacing: 0.4px; text-align: center; }
th.split, td.split { border-left: 3px solid #c9aa7c; }
th.supply, td.supply { border-left: 3px solid #c9aa7c; border-right: 3px solid #c9aa7c; text-align: center; }
td.supply { text-align: right; }
td.sticky, th.sticky { position: sticky; left: 0; z-index: 3; background: #0d1620; min-width: 108px; border-right: 3px solid #c9aa7c; }
.sheet { min-width: 0; width: 100%; font-size: 11px; table-layout: auto; }
.sheet th, .sheet td { padding: 4px 3px; white-space: nowrap; }
.food-in { width: 52px; background: transparent; border: none; border-bottom: 1px solid rgba(201,170,124,0.35); color: inherit; font-size: 11px; font-weight: 700; text-align: right; outline: none; }
.food-in:focus { border-bottom-color: var(--gold); }
.dollar-in { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 1px; font-weight: 700; }
.dollar-in .sym { color: inherit; font-size: 12px; }
.pct-hi { color: var(--red); font-weight: 700; }
.pct-ok { color: var(--green); font-weight: 700; }
.hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 16px; }
.hero-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.hero-lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.hero-val { font-size: 20px; font-weight: 700; color: var(--gold); }
.hero-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.outlet-link { font-size: 11px; color: var(--blue); text-decoration: none; }
.outlet-link:hover { color: var(--gold); }
th.grp a { color: var(--gold); text-decoration: none; }
th.grp a:hover { text-decoration: underline; color: #e8d5a8; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
.log { margin-top: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; max-width: 920px; }
.log-head { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.log-row { font-size: 12px; color: var(--text); padding: 6px 0; border-bottom: 1px solid rgba(90,139,167,0.12); display: grid; grid-template-columns: 178px 1fr; gap: 12px; }
.log-row:last-child { border-bottom: none; }
.log-ts { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log-empty { color: var(--muted); font-style: italic; font-size: 12px; }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr 1fr; } .log-row { grid-template-columns: 1fr; gap: 2px; } }
@media print {
  .tabs, .hdr-btn, .week-nav-btn { display: none; }
  body { background: white; color: #111; }
  td, th { background: white; color: #111; }
}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="eyebrow">Unbridled Hospitality Group</div>
    <h1>Period Labor and Supply Summary</h1>
  </div>
  <div class="hdr-right">
    <span class="status" id="status">Loading…</span>
    <button class="hdr-btn" onclick="loadAll()">Refresh</button>
    <button class="hdr-btn" onclick="window.print()">Print</button>
  </div>
</div>
<div class="week-nav">
  <label>View</label>
  <div class="grain" id="grain">
    <button type="button" id="grainDaily" onclick="setGrain('daily')">Daily</button>
    <button type="button" id="grainWeekly" onclick="setGrain('weekly')">Weekly</button>
  </div>
  <label>Period</label>
  <button class="week-nav-btn" onclick="shiftPeriod(-1)">‹</button>
  <select class="period-sel" id="periodSel" onchange="onPeriodSelect()"></select>
  <button class="week-nav-btn" onclick="shiftPeriod(1)">›</button>
  <span class="period-chip" id="periodChip">Period</span>
  <span class="range" id="rangeLbl"></span>
  <span class="tax-chip" id="taxChip"></span>
</div>
<div class="wrap">
  <p class="note" id="note"></p>
  <div class="hero" id="hero"></div>
  <div class="grid"><table id="grid"></table></div>
  <div class="log">
    <div class="log-head">Chronological log</div>
    <div id="logBody"></div>
  </div>
</div>
<script>
const OUTLETS = [
  { id:'fph', name:'1887 / War Room / FPH', short:'1887 / War Room / FPH', ns:'fp-ph', prefix:'fp-ph-wk-', history:'fp-ph-history', events:true, hotel:false, url:'https://offers.hotelstcloud.com/assets/fp-ph-planner' },
  { id:'fp',  name:'Fremont Provisions', short:'Fremont Provisions', ns:'fp', prefix:'fp-labor-wk-', history:'fp-labor-history', events:true, hotel:false, url:'https://offers.hotelstcloud.com/assets/fp-labor-planner' },
  { id:'hsc', name:'Hotel St. Cloud', short:'Hotel', ns:'hsc', prefix:'hsc-wk-', history:'hsc-history', events:false, hotel:true, url:'https://offers.hotelstcloud.com/assets/hsc-labor-planner' },
  { id:'socc',name:'Standard Oil Coffee Co', short:'Standard Oil', ns:'socc', prefix:'socc-wk-', history:'socc-history', events:true, hotel:false, url:'https://offers.hotelstcloud.com/assets/socc-labor-planner' },
];

let bundles = {};
let foodByWeek = {};
let forecastByPeriod = {};
let changeLog = [];
let pendingLog = [];
let saveLock = Promise.resolve();
let viewPeriod = null;
let viewYear = 2026;
let viewGrain = 'daily';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const FOOD_NS = 'uhg-food';
const FC_NS = 'uhg-forecast';
const LOG_NS = 'uhg-log';
const RESERVED = { _log:1, entries:1, weeks:1, log:1 };

function enqueue(fn) {
  saveLock = saveLock.then(fn, fn);
  return saveLock;
}
async function kvGet(ns) {
  const res = await fetch('/api/planner/bundle?ns=' + ns);
  const json = await res.json();
  return (json.data && typeof json.data === 'object') ? json.data : {};
}
async function kvPut(ns, body) {
  await fetch('/api/planner/bundle?ns=' + ns, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
function stamp() { return new Date().toISOString(); }
function fmtStamp(iso) {
  try {
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/Denver', month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  } catch (e) { return iso; }
}
function logChange(entry) {
  pendingLog.push(Object.assign({ ts: stamp() }, entry));
}
function moneyPlain(n) {
  if (n == null || n === '' || !isFinite(n)) return '—';
  return Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}
function renderLog() {
  const el = document.getElementById('logBody');
  if (!el) return;
  const rows = (changeLog || []).slice().reverse().slice(0, 250);
  if (!rows.length) {
    el.innerHTML = '<div class="log-empty">No typed entries yet. Every food, supply, and forecast change is stamped here. Nothing is deleted.</div>';
    return;
  }
  el.innerHTML = rows.map(r => {
    const who = r.kind === 'forecast'
      ? `Forecast ${r.period || ''} ${r.outlet || ''} ${r.field || ''}`
      : `Week of ${r.week || ''} ${r.field || ''}`;
    return `<div class="log-row"><div class="log-ts">${fmtStamp(r.ts)}</div><div>${who.trim()}: ${moneyPlain(r.from)} → ${moneyPlain(r.to)}</div></div>`;
  }).join('');
}
async function flushLog() {
  if (!pendingLog.length) return;
  const remote = await kvGet(LOG_NS);
  const existing = Array.isArray(remote.entries) ? remote.entries.slice() : [];
  const batch = pendingLog.slice();
  const seen = new Set(existing.map(e => JSON.stringify(e)));
  const extra = batch.filter(e => !seen.has(JSON.stringify(e)));
  const entries = existing.concat(extra);
  await kvPut(LOG_NS, { entries });
  pendingLog = pendingLog.slice(batch.length);
  changeLog = entries;
}
function unwrapFood(data) {
  if (!data || typeof data !== 'object') return {};
  if (data.weeks && typeof data.weeks === 'object') return data.weeks;
  const out = {};
  Object.keys(data).forEach(k => { if (!RESERVED[k]) out[k] = data[k]; });
  return out;
}

function fcKey() { return viewYear + '-P' + viewPeriod; }
function fcEntry() {
  const raw = forecastByPeriod[fcKey()];
  return (raw && typeof raw === 'object') ? raw : {};
}
async function saveForecast() {
  return enqueue(async () => {
    try {
      const remote = await kvGet(FC_NS);
      const merged = Object.assign({}, remote, forecastByPeriod);
      await kvPut(FC_NS, merged);
      forecastByPeriod = merged;
      await flushLog();
    } catch (e) {}
  });
}
function setFc(oid, field, val) {
  const key = fcKey();
  const all = fcEntry();
  const cur = Object.assign({}, all[oid] || {});
  const from = cur[field];
  if (val === '' || val == null) delete cur[field];
  else {
    const n = parseFloat(val);
    if (!isFinite(n)) delete cur[field];
    else cur[field] = Math.round(n * 100) / 100;
  }
  const to = cur[field];
  if (from !== to) logChange({ kind: 'forecast', period: key, outlet: oid, field, from: from == null ? null : from, to: to == null ? null : to });
  if (!Object.keys(cur).length) delete all[oid];
  else all[oid] = cur;
  if (!Object.keys(all).length) delete forecastByPeriod[key];
  else forecastByPeriod[key] = all;
  saveForecast();
  render();
}
function dollarInput(html) {
  return `<span class="dollar-in"><span class="sym">$</span>${html}</span>`;
}
function fcInput(oid, field, n) {
  const shown = (n || n === 0) ? n : '';
  return dollarInput(`<input class="food-in" type="number" step="0.01" min="0" value="${shown}" placeholder="—" onchange="setFc('${oid}','${field}', this.value)">`);
}
function fcNum(oid, field) {
  const v = (fcEntry()[oid] || {})[field];
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}
function fcParts(o) {
  const rest = fcNum(o.id, 'rest');
  const evt = o.events ? fcNum(o.id, 'evt') : 0;
  const hrly = fcNum(o.id, 'hrly');
  const mgmt = fcNum(o.id, 'mgmt');
  let labor = hrly + mgmt;
  labor += labor * taxRate(viewPeriod);
  if (!hrly && !mgmt) labor = fcNum(o.id, 'labor');
  const tot = rest + evt;
  const laborPct = tot > 0 && labor ? labor / tot : null;
  return { rest, evt, hrly, mgmt, labor, tot, laborPct, occ: fcNum(o.id, 'occ') };
}
function periodComplete() {
  const weeks = weeksInPeriod(viewYear, viewPeriod);
  if (!weeks.length) return 0;
  const start = weeks[0];
  const end = addDays(weeks[weeks.length - 1], 6);
  const today = new Date();
  today.setHours(0,0,0,0);
  if (today < start) return 0;
  if (today > end) return 1;
  const total = (end - start) / 86400000 + 1;
  const done = (today - start) / 86400000 + 1;
  return done / total;
}

function foodEntry(mondayYmd) {
  const raw = foodByWeek[mondayYmd];
  if (raw && typeof raw === 'object') {
    return { fp: parseFloat(raw.fp) || 0, hsc: parseFloat(raw.hsc) || 0, supplies: parseFloat(raw.supplies) || 0 };
  }
  const n = parseFloat(raw);
  return { fp: n > 0 ? n : 0, hsc: 0, supplies: 0 };
}
async function saveFood() {
  return enqueue(async () => {
    try {
      const remote = unwrapFood(await kvGet(FOOD_NS));
      const merged = Object.assign({}, remote, foodByWeek);
      await kvPut(FOOD_NS, merged);
      foodByWeek = merged;
      await flushLog();
    } catch (e) {}
  });
}
function setFood(mondayYmd, which, val) {
  const cur = foodEntry(mondayYmd);
  const from = cur[which];
  const n = parseFloat(val);
  cur[which] = n > 0 ? Math.round(n * 100) / 100 : 0;
  if (from !== cur[which]) logChange({ kind: 'week', week: mondayYmd, field: which, from, to: cur[which] });
  foodByWeek[mondayYmd] = cur;
  saveFood();
  render();
}
function foodInput(mondayYmd, which, n) {
  return dollarInput(`<input class="food-in" type="number" step="0.01" min="0" value="${n || ''}" placeholder="—" onchange="setFood('${mondayYmd}','${which}', this.value)">`);
}
function foodBlock(fpFood, hscFood, fpRev, hscRev, allRev, allLab, opts) {
  const total = (fpFood || 0) + (hscFood || 0);
  const fpPct = fpRev > 0 && fpFood ? fpFood / fpRev : null;
  const hscPct = hscRev > 0 && hscFood ? hscFood / hscRev : null;
  const totPct = allRev > 0 && total ? total / allRev : null;
  const prime = allRev > 0 && (allLab || total) ? (allLab + total) / allRev : null;
  const cls = (p, hi) => (p != null && p > hi) ? 'pct-hi' : (p == null ? '' : 'pct-ok');
  const fpCell = opts && opts.forecast
    ? fcInput('food', 'fp', fpFood)
    : opts && opts.input ? foodInput(opts.key, 'fp', fpFood) : money(fpFood);
  const hscCell = opts && opts.forecast
    ? fcInput('food', 'hsc', hscFood)
    : opts && opts.input ? foodInput(opts.key, 'hsc', hscFood) : money(hscFood);
  return `<td class="split">${fpCell}</td><td class="${cls(fpPct,0.35)}">${pct(fpPct)}</td>`
    + `<td>${hscCell}</td><td class="${cls(hscPct,0.35)}">${pct(hscPct)}</td>`
    + `<td class="split">${money(total)}</td><td class="${cls(totPct,0.35)}">${pct(totPct)}</td>`
    + `<td class="split ${cls(prime,0.70)}">${pct(prime)}</td>`
    + supplyCell(opts && opts.supplies, opts);
}
function supplyCell(n, opts) {
  const v = n || 0;
  if (opts && opts.forecast) return `<td class="supply">${fcInput('supplies', 'amt', v)}</td>`;
  if (opts && opts.input) return `<td class="supply">${foodInput(opts.key, 'supplies', v)}</td>`;
  return `<td class="supply">${money(v)}</td>`;
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  const diff = (dow === 0) ? -6 : 1 - dow;
  x.setDate(x.getDate() + diff);
  return x;
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function periodOf(d) { return Math.ceil(getISOWeek(d) / 4); }
function yearOfISO(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - day);
  return x.getUTCFullYear();
}
function taxRate(period) { return period >= 8 ? 0.13 : 0.11; }
function money(n) {
  if (n == null || n === '' || !isFinite(n)) return '—';
  const rounded = Math.round(n);
  if (rounded === 0) return '$0';
  return '$' + rounded.toLocaleString();
}
function pct(n) {
  if (n == null || !isFinite(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}
function sumArr(a) {
  if (!Array.isArray(a)) return 0;
  let s = 0;
  for (const v of a) {
    const n = parseFloat(v);
    if (n) s += n;
  }
  return s;
}

function weeksInPeriod(year, period) {
  const weeks = [];
  let d = new Date(year, 0, 4);
  d = mondayOf(d);
  for (let i = 0; i < 60; i++) {
    const isoY = yearOfISO(d);
    const p = periodOf(d);
    if (isoY === year && p === period) weeks.push(new Date(d));
    if (isoY > year || (isoY === year && p > period && weeks.length)) break;
    d = addDays(d, 7);
  }
  return weeks;
}

function weekFromBundle(bundle, prefix, mondayStr) {
  if (!bundle) return null;
  return bundle[prefix + mondayStr] || null;
}

function rollWeek(outlet, monday, bundle) {
  const key = ymd(monday);
  const w = weekFromBundle(bundle, outlet.prefix, key);
  const rest = w ? sumArr(w.actrevs) : 0;
  const evt = (outlet.events && w) ? sumArr(w.evtrevs) : 0;
  let hotel = 0;
  if (outlet.hotel && w) hotel = sumArr(w.actrevs) || sumArr(w.bookedrevs);
  const restRev = outlet.hotel ? hotel : rest;
  const totalRev = restRev + evt;
  const hrly = w ? sumArr(w.hrlyacts) : 0;
  const mgmt = w ? sumArr(w.mgmtacts) : 0;
  const tax = (hrly + mgmt) * taxRate(viewPeriod);
  const labor = hrly + mgmt + tax;
  const laborPct = totalRev > 0 ? labor / totalRev : null;
  const has = !!(w && (restRev || evt || hrly || mgmt));
  return { key, restRev, evt, totalRev, hrly, mgmt, tax, labor, laborPct, has };
}

function dayVal(arr, di) {
  if (!Array.isArray(arr) || arr[di] == null || arr[di] === '') return 0;
  const n = parseFloat(arr[di]);
  return n || 0;
}

function rollDay(outlet, monday, di, bundle) {
  const key = ymd(monday);
  const w = weekFromBundle(bundle, outlet.prefix, key);
  const rest = w ? dayVal(w.actrevs, di) : 0;
  const evt = (outlet.events && w) ? dayVal(w.evtrevs, di) : 0;
  let hotel = 0;
  if (outlet.hotel && w) hotel = dayVal(w.actrevs, di) || dayVal(w.bookedrevs, di);
  const restRev = outlet.hotel ? hotel : rest;
  const totalRev = restRev + evt;
  const hrly = w ? dayVal(w.hrlyacts, di) : 0;
  const mgmt = w ? dayVal(w.mgmtacts, di) : 0;
  const tax = (hrly + mgmt) * taxRate(viewPeriod);
  const labor = hrly + mgmt + tax;
  const laborPct = totalRev > 0 ? labor / totalRev : null;
  const has = !!(w && (restRev || evt || hrly || mgmt));
  return { key, restRev, evt, totalRev, hrly, mgmt, tax, labor, laborPct, has };
}

function daysInPeriod(year, period) {
  const weeks = weeksInPeriod(year, period);
  const days = [];
  weeks.forEach(m => {
    for (let di = 0; di < 7; di++) {
      days.push({ monday: m, di, date: addDays(m, di) });
    }
  });
  return days;
}

function rollPeriod(outlet, year, period, bundle) {
  const weeks = weeksInPeriod(year, period).map(m => rollWeek(outlet, m, bundle));
  const tot = weeks.reduce((a, w) => {
    a.restRev += w.restRev; a.evt += w.evt; a.totalRev += w.totalRev;
    a.hrly += w.hrly; a.mgmt += w.mgmt; a.tax += w.tax; a.labor += w.labor;
    return a;
  }, { restRev:0, evt:0, totalRev:0, hrly:0, mgmt:0, tax:0, labor:0 });
  tot.laborPct = tot.totalRev > 0 ? tot.labor / tot.totalRev : null;
  tot.has = weeks.some(w => w.has);
  return { weeks, tot };
}

function currentPeriodInfo() {
  const today = new Date();
  return { year: yearOfISO(today), period: periodOf(mondayOf(today)) };
}

function fillPeriodSelect() {
  const sel = document.getElementById('periodSel');
  if (!sel) return;
  const years = [viewYear - 1, viewYear, viewYear + 1].filter((y, i, a) => a.indexOf(y) === i);
  const opts = [];
  years.forEach(y => {
    for (let p = 1; p <= 13; p++) {
      opts.push(`<option value="${y}-${p}" ${y===viewYear && p===viewPeriod ? 'selected' : ''}>P${p} · ${y}</option>`);
    }
  });
  sel.innerHTML = opts.join('');
}

function onPeriodSelect() {
  const v = document.getElementById('periodSel').value.split('-');
  viewYear = parseInt(v[0], 10);
  viewPeriod = parseInt(v[1], 10);
  render();
}

function setGrain(g) {
  viewGrain = g;
  render();
}

function shiftPeriod(delta) {
  viewPeriod += delta;
  if (viewPeriod < 1) { viewPeriod = 13; viewYear -= 1; }
  if (viewPeriod > 13) { viewPeriod = 1; viewYear += 1; }
  render();
}

function rowHTML(label, w, isTotal) {
  const cls = isTotal ? 'total' : (w.has ? '' : 'blank');
  const pcls = (w.laborPct != null && w.laborPct > 0.35) ? 'pct-hi' : 'pct-ok';
  return `<tr class="${cls}">
    <td class="left">${label}</td>
    <td>${money(w.restRev)}</td>
    <td>${money(w.evt)}</td>
    <td>${money(w.totalRev)}</td>
    <td>${money(w.hrly)}</td>
    <td>${money(w.mgmt)}</td>
    <td>${money(w.tax)}</td>
    <td>${money(w.labor)}</td>
    <td class="${w.laborPct==null?'':pcls}">${pct(w.laborPct)}</td>
  </tr>`;
}

function tableHead(revLabel, firstLabel) {
  return `<thead><tr>
    <th class="left">${firstLabel || 'Week'}</th>
    <th>${revLabel}</th>
    <th>Event Rev</th>
    <th>Total Rev</th>
    <th>Hourly</th>
    <th>Management</th>
    <th>Tax</th>
    <th>Total Labor</th>
    <th>Labor %</th>
  </tr></thead>`;
}

function fmtDay(d) {
  return `${DAYS[d.getDay() === 0 ? 6 : d.getDay()-1]} ${d.getMonth()+1}/${d.getDate()}`;
}

function renderOutlet(o) {
  const weeks = weeksInPeriod(viewYear, viewPeriod);
  const bundle = bundles[o.ns] || {};
  const rolled = rollPeriod(o, viewYear, viewPeriod, bundle);
  const revLabel = o.hotel ? 'Hotel Rev' : 'Restaurant Rev';
  const grainNote = viewGrain === 'daily' ? 'Each row is one day.' : 'Each row is one week.';
  document.getElementById('note').innerHTML = `${grainNote} Live from the weekly sheet. Tax is ${Math.round(taxRate(viewPeriod)*100)}% of hourly + management. <a class="outlet-link" href="${o.url}" target="_blank">Open weekly planner</a>`;
  document.getElementById('hero').innerHTML = `
    <div class="hero-card"><div class="hero-lbl">Total revenue</div><div class="hero-val">${money(rolled.tot.totalRev)}</div><div class="hero-sub">${o.hotel ? 'Rooms' : 'Restaurant'} + events</div></div>
    <div class="hero-card"><div class="hero-lbl">Total labor</div><div class="hero-val">${money(rolled.tot.labor)}</div><div class="hero-sub">Hourly + mgmt + tax</div></div>
    <div class="hero-card"><div class="hero-lbl">Labor %</div><div class="hero-val">${pct(rolled.tot.laborPct)}</div><div class="hero-sub">Labor / total revenue</div></div>
    <div class="hero-card"><div class="hero-lbl">Management</div><div class="hero-val">${money(rolled.tot.mgmt)}</div><div class="hero-sub">Standing daily rates included</div></div>`;
  let body = tableHead(revLabel, viewGrain === 'daily' ? 'Day' : 'Week') + '<tbody>';
  if (viewGrain === 'daily') {
    daysInPeriod(viewYear, viewPeriod).forEach(day => {
      const w = rollDay(o, day.monday, day.di, bundle);
      body += rowHTML(fmtDay(day.date), w, false);
    });
  } else {
    rolled.weeks.forEach((w, i) => {
      const m = weeks[i];
      const sun = addDays(m, 6);
      const label = `Wk ${i+1} · ${m.getMonth()+1}/${m.getDate()}–${sun.getMonth()+1}/${sun.getDate()}`;
      body += rowHTML(label, w, false);
    });
  }
  body += rowHTML('Period total', rolled.tot, true);
  body += '</tbody>';
  document.getElementById('grid').innerHTML = body;
}

function summaryOutlets() {
  return ['fp','fph','hsc','socc'].map(id => OUTLETS.find(o => o.id === id));
}

function outletCells(w, o, first) {
  const pcls = (w.laborPct != null && w.laborPct > 0.35) ? 'pct-hi' : 'pct-ok';
  const split = first ? '' : ' split';
  let html = `<td class="${split}">${money(w.restRev)}</td>`;
  if (o.events) html += `<td>${money(w.evt)}</td>`;
  html += `<td>${money(w.hrly)}</td><td>${money(w.mgmt)}</td><td>${money(w.labor)}</td><td class="${w.laborPct==null?'':pcls}">${pct(w.laborPct)}</td>`;
  return html;
}

function outletForecastCells(o, first) {
  const p = fcParts(o);
  const pcls = (p.laborPct != null && p.laborPct > 0.35) ? 'pct-hi' : 'pct-ok';
  const split = first ? '' : ' split';
  let html = `<td class="${split}">${fcInput(o.id, 'rest', p.rest)}</td>`;
  if (o.events) html += `<td>${fcInput(o.id, 'evt', p.evt)}</td>`;
  html += `<td>${fcInput(o.id, 'hrly', p.hrly)}</td><td>${fcInput(o.id, 'mgmt', p.mgmt)}</td><td>${money(p.labor)}</td><td class="${p.laborPct==null?'':pcls}">${pct(p.laborPct)}</td>`;
  return html;
}
function vsPct(act, fc) {
  if (!fc) return null;
  return act / fc;
}
function outletVsCells(act, o, first) {
  const p = fcParts(o);
  const rest = vsPct(act.restRev, p.rest);
  const evt = o.events ? vsPct(act.evt, p.evt) : null;
  const hrly = vsPct(act.hrly, p.hrly);
  const mgmt = vsPct(act.mgmt, p.mgmt);
  const lab = vsPct(act.labor, p.labor);
  const split = first ? '' : ' split';
  let html = `<td class="${split}">${pct(rest)}</td>`;
  if (o.events) html += `<td>${pct(evt)}</td>`;
  html += `<td>${pct(hrly)}</td><td>${pct(mgmt)}</td><td>${pct(lab)}</td><td>—</td>`;
  return html;
}

function renderSummary() {
  const outlets = summaryOutlets();
  const weeks = weeksInPeriod(viewYear, viewPeriod);
  const periodRolls = outlets.map(o => rollPeriod(o, viewYear, viewPeriod, bundles[o.ns] || {}));
  const grandRev = periodRolls.reduce((s, r) => s + r.tot.totalRev, 0);
  const grandLab = periodRolls.reduce((s, r) => s + r.tot.labor, 0);
  document.getElementById('hero').innerHTML = `
    <div class="hero-card"><div class="hero-lbl">UHG actual revenue</div><div class="hero-val">${money(grandRev)}</div></div>
    <div class="hero-card"><div class="hero-lbl">UHG actual labor</div><div class="hero-val">${money(grandLab)}</div></div>
    <div class="hero-card"><div class="hero-lbl">Blended labor %</div><div class="hero-val">${pct(grandRev ? grandLab / grandRev : null)}</div></div>
    <div class="hero-card"><div class="hero-lbl">Tax this period</div><div class="hero-val">${Math.round(taxRate(viewPeriod)*100)}%</div><div class="hero-sub">On hourly + management</div></div>`;
  document.getElementById('note').textContent = 'Click an outlet name for its labor tracker. Click Supplies for the supply planner. P9 labor budget is Stan’s numbers plus 13% tax. Supply budget is $9,000 ($2,000 FP / $7,000 1887).';

  const grp = outlets.map((o, i) => {
    const span = o.events ? 6 : 5;
    return `<th class="grp${i ? ' split' : ''}" colspan="${span}"><a href="${o.url}" target="_blank" rel="noopener">${o.name}</a></th>`;
  }).join('') + `<th class="grp split" colspan="3">Combined</th><th class="grp" colspan="2">FP Food</th><th class="grp-plain" colspan="2">HSC Food</th><th class="grp" colspan="2">Total Food</th><th class="grp">Prime</th><th class="grp supply"><a href="https://offers.hotelstcloud.com/assets/supply-planner" target="_blank" rel="noopener">Supplies</a></th>`;

  const subs = outlets.map((o, i) => {
    const first = i ? ' split' : '';
    let h = `<th class="sub${first}">Revenue</th>`;
    if (o.events) h += `<th class="sub">Events</th>`;
    h += `<th class="sub">Hourly</th><th class="sub">Mgmt</th><th class="sub">Labor</th><th class="sub">%</th>`;
    return h;
  }).join('') + `<th class="sub split">Revenue</th><th class="sub">Labor</th><th class="sub">%</th><th class="sub split">FP Food</th><th class="sub">FP %</th><th class="sub">HSC Food</th><th class="sub">HSC %</th><th class="sub split">Food $</th><th class="sub">Food %</th><th class="sub split">Prime %</th><th class="sub supply">$</th>`;

  let html = `<table class="sheet"><thead>
    <tr><th class="left sticky"></th>${grp}</tr>
    <tr><th class="left sticky">Date</th>${subs}</tr>
  </thead><tbody>`;

  const periodAcc = { cells: outlets.map(() => ({ restRev:0, evt:0, totalRev:0, hrly:0, mgmt:0, tax:0, labor:0 })), combRev:0, combLab:0, fpFood:0, hscFood:0, fpRev:0, hscRev:0, supplies:0 };

  weeks.forEach((monday, wi) => {
    const weekAcc = outlets.map(() => ({ restRev:0, evt:0, totalRev:0, hrly:0, mgmt:0, tax:0, labor:0, has:false }));
    let weekCombRev = 0, weekCombLab = 0;
    for (let di = 0; di < 7; di++) {
      const date = addDays(monday, di);
      let row = `<tr><td class="left sticky">${fmtDay(date)}</td>`;
      let combRev = 0, combLab = 0, any = false;
      outlets.forEach((o, oi) => {
        const w = rollDay(o, monday, di, bundles[o.ns] || {});
        row += outletCells(w, o, oi === 0);
        const acc = weekAcc[oi];
        acc.restRev += w.restRev; acc.evt += w.evt; acc.totalRev += w.totalRev;
        acc.hrly += w.hrly; acc.mgmt += w.mgmt; acc.tax += w.tax; acc.labor += w.labor;
        if (w.has) acc.has = true;
        combRev += w.totalRev; combLab += w.labor;
        if (w.has) any = true;
      });
      const cp = combRev > 0 ? combLab / combRev : null;
      const pcls = (cp != null && cp > 0.35) ? 'pct-hi' : 'pct-ok';
      row += `<td class="split">${money(combRev)}</td><td>${money(combLab)}</td><td class="${cp==null?'':pcls}">${pct(cp)}</td><td class="split">—</td><td>—</td><td>—</td><td>—</td><td class="split">—</td><td>—</td><td class="split">—</td><td class="supply">—</td></tr>`;
      if (viewGrain !== 'weekly') html += row;
      weekCombRev += combRev; weekCombLab += combLab;
    }
    let tot = `<tr class="week-tot"><td class="left sticky">Weekly totals · Wk ${wi+1}</td>`;
    weekAcc.forEach((w, oi) => {
      w.laborPct = w.totalRev > 0 ? w.labor / w.totalRev : null;
      tot += outletCells(w, outlets[oi], oi === 0);
      const p = periodAcc.cells[oi];
      p.restRev += w.restRev; p.evt += w.evt; p.totalRev += w.totalRev;
      p.hrly += w.hrly; p.mgmt += w.mgmt; p.tax += w.tax; p.labor += w.labor;
    });
    const wp = weekCombRev > 0 ? weekCombLab / weekCombRev : null;
    const wpcls = (wp != null && wp > 0.35) ? 'pct-hi' : 'pct-ok';
    const wkKey = ymd(monday);
    const fe = foodEntry(wkKey);
    const fpIdx = outlets.findIndex(o => o.id === 'fp');
    const fpRev = fpIdx >= 0 ? weekAcc[fpIdx].totalRev : 0;
    const hscRev = weekAcc.reduce((s, w, i) => s + (outlets[i].id === 'fp' ? 0 : w.totalRev), 0);
    tot += `<td class="split">${money(weekCombRev)}</td><td>${money(weekCombLab)}</td><td class="${wp==null?'':wpcls}">${pct(wp)}</td>`
      + foodBlock(fe.fp, fe.hsc, fpRev, hscRev, weekCombRev, weekCombLab, { input: true, key: wkKey, supplies: fe.supplies });
    tot += `</tr>`;
    html += tot;
    periodAcc.combRev += weekCombRev; periodAcc.combLab += weekCombLab;
    periodAcc.fpFood += fe.fp; periodAcc.hscFood += fe.hsc;
    periodAcc.fpRev += fpRev; periodAcc.hscRev += hscRev;
    periodAcc.supplies += fe.supplies;
  });

  let per = `<tr class="total"><td class="left sticky">Period ${viewPeriod} actual</td>`;
  periodAcc.cells.forEach((w, oi) => {
    w.laborPct = w.totalRev > 0 ? w.labor / w.totalRev : null;
    per += outletCells(w, outlets[oi], oi === 0);
  });
  const pp = periodAcc.combRev > 0 ? periodAcc.combLab / periodAcc.combRev : null;
  const ppcls = (pp != null && pp > 0.35) ? 'pct-hi' : 'pct-ok';
  per += `<td class="split">${money(periodAcc.combRev)}</td><td>${money(periodAcc.combLab)}</td><td class="${pp==null?'':ppcls}">${pct(pp)}</td>`
    + foodBlock(periodAcc.fpFood, periodAcc.hscFood, periodAcc.fpRev, periodAcc.hscRev, periodAcc.combRev, periodAcc.combLab, { supplies: periodAcc.supplies });
  per += `</tr>`;
  html += per;

  const fcFpFood = fcNum('food', 'fp');
  const fcHscFood = fcNum('food', 'hsc');
  const fcSupplies = fcNum('supplies', 'amt');
  let fcCombRev = 0, fcCombLab = 0, fcFpRev = 0, fcHscRev = 0;
  let fcRow = `<tr class="forecast"><td class="left sticky">Period ${viewPeriod} budget</td>`;
  outlets.forEach((o, oi) => {
    fcRow += outletForecastCells(o, oi === 0);
    const p = fcParts(o);
    fcCombRev += p.tot;
    fcCombLab += p.labor;
    if (o.id === 'fp') fcFpRev += p.tot;
    else fcHscRev += p.tot;
  });
  const fcLp = fcCombRev > 0 && fcCombLab ? fcCombLab / fcCombRev : null;
  const fcLpCls = (fcLp != null && fcLp > 0.35) ? 'pct-hi' : 'pct-ok';
  fcRow += `<td class="split">${money(fcCombRev)}</td><td>${money(fcCombLab)}</td><td class="${fcLp==null?'':fcLpCls}">${pct(fcLp)}</td>`
    + foodBlock(fcFpFood, fcHscFood, fcFpRev, fcHscRev, fcCombRev, fcCombLab, { forecast: true, supplies: fcSupplies });
  fcRow += `</tr>`;
  html += fcRow;

  const done = periodComplete();
  let vs = `<tr class="vs"><td class="left sticky">% of forecast · ${Math.round(done*100)}% of period</td>`;
  outlets.forEach((o, oi) => {
    vs += outletVsCells(periodAcc.cells[oi], o, oi === 0);
  });
  vs += `<td class="split">${pct(vsPct(periodAcc.combRev, fcCombRev))}</td><td>${pct(vsPct(periodAcc.combLab, fcCombLab))}</td><td>—</td>`
    + `<td class="split">${pct(vsPct(periodAcc.fpFood, fcFpFood))}</td><td>—</td><td>${pct(vsPct(periodAcc.hscFood, fcHscFood))}</td><td>—</td>`
    + `<td class="split">${pct(vsPct(periodAcc.fpFood + periodAcc.hscFood, fcFpFood + fcHscFood))}</td><td>—</td><td class="split">—</td>`
    + `<td class="supply">${pct(vsPct(periodAcc.supplies, fcSupplies))}</td></tr>`;
  html += vs + '</tbody></table>';
  document.getElementById('grid').innerHTML = html;
}

function render() {
  fillPeriodSelect();
  document.getElementById('grainDaily').classList.toggle('active', viewGrain === 'daily');
  document.getElementById('grainWeekly').classList.toggle('active', viewGrain === 'weekly');
  const weeks = weeksInPeriod(viewYear, viewPeriod);
  const first = weeks[0], last = addDays(weeks[weeks.length-1], 6);
  document.getElementById('periodChip').textContent = `Period ${viewPeriod} · ${viewYear}`;
  document.getElementById('rangeLbl').textContent = first ? `${first.getMonth()+1}/${first.getDate()} – ${last.getMonth()+1}/${last.getDate()}` : '';
  document.getElementById('taxChip').textContent = `Tax ${Math.round(taxRate(viewPeriod)*100)}%`;
  renderSummary();
  renderLog();
}

async function loadAll() {
  document.getElementById('status').textContent = 'Loading…';
  const results = await Promise.all(OUTLETS.map(async o => {
    try {
      const res = await fetch('/api/planner/bundle?ns=' + o.ns);
      const json = await res.json();
      return [o.ns, json.data || {}];
    } catch (e) {
      return [o.ns, {}];
    }
  }));
  bundles = Object.fromEntries(results);
  try {
    const fj = await kvGet(FOOD_NS);
    foodByWeek = unwrapFood(fj);
  } catch (e) { foodByWeek = foodByWeek || {}; }
  try {
    forecastByPeriod = await kvGet(FC_NS);
  } catch (e) { forecastByPeriod = forecastByPeriod || {}; }
  try {
    const lg = await kvGet(LOG_NS);
    changeLog = Array.isArray(lg.entries) ? lg.entries : [];
  } catch (e) { changeLog = changeLog || []; }
  document.getElementById('status').textContent = 'Live from KV';
  render();
}

(function init() {
  const cur = currentPeriodInfo();
  viewYear = cur.year;
  viewPeriod = cur.period;
  loadAll();
})();
</script>
</body>
</html>
