<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="src/fm-phase1-theme.css">
<link rel="stylesheet" href="src/fm-phase1-print.css">
<style>
/* Phase 2 app (preview). Everything is scoped to .fm-p1; .p2-* classes are this app's layout. */
:root { --page: #EFE8DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #243A32; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #243A32; color-scheme: dark; }
body { margin: 0; background: var(--page); }
#p2 { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); background: var(--fmp1-bg); }
#p2.is-sign { display: block; }
.fm-p1 p { margin: 0; }
.fm-p1 .p2-side { position: sticky; top: 0; max-height: 100vh; align-self: start; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 20px 14px 16px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); background: var(--fmp1-surface); border-right: 1px solid var(--fmp1-line); }
.fm-p1 .p2-brand { display: flex; flex-direction: column; gap: 4px; padding: 0 6px; }
.fm-p1 .p2-brand .fmp1-logo--tagline { height: 46px; }
.fm-p1 .p2-nav { display: flex; flex-direction: column; gap: 2px; }
/* Section headings (Projects, Company books, Company) read as headings: full ink, bold, a rule underneath, room above. */
.fm-p1 .p2-nav h2 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--fmp1-ink); font-weight: 700; margin: 0 0 6px; padding: 0 10px 7px; border-bottom: 1px solid var(--fmp1-line); }
.fm-p1 .p2-nav + .p2-nav { margin-top: 10px; }
.fm-p1 .p2-nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--fmp1-ink-2); text-decoration: none; font-size: 13.5px; }
.fm-p1 .p2-nav a:hover { background: var(--fmp1-surface-2); color: var(--fmp1-ink); }
.fm-p1 .p2-nav a[aria-current="page"] { background: var(--fmp1-accent-soft); color: var(--fmp1-ink); font-weight: 600; }
.fm-p1 .p2-nav a:focus-visible, .fm-p1 .p2-tabs a:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 1px; }
.fm-p1 .p2-nav .count { font-size: 11px; font-weight: 700; background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); border-radius: 999px; padding: 1px 7px; }
.fm-p1 .p2-side-foot { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--fmp1-line); display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.fm-p1 .p2-side-foot .fmp1-theme { display: flex; }
.fm-p1 .p2-side-foot .fmp1-theme button { flex: 1 1 0; padding: 7px 12px; }   /* the two halves fill the box: no empty strip beside Dark */
#p2 { background: linear-gradient(to right, var(--fmp1-surface) 236px, var(--fmp1-bg) 236px); }
.fm-p1 .p2-newbtn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border-radius: 9px; background: var(--fmp1-primary); color: var(--fmp1-on-primary); font-weight: 600; font-size: 14px; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.fm-p1 .p2-newbtn:hover { filter: brightness(1.08); }
.fm-p1 .p2-newbtn[aria-current="page"] { outline: 2px solid var(--fmp1-accent); outline-offset: 2px; }
.fm-p1 .p2-newbtn:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 2px; }
.fm-p1 .p2-newbtn span { font-size: 17px; line-height: 1; }
.fm-p1 .p2-start { display: flex; flex-direction: column; gap: 6px; }
.fm-p1 .p2-start-k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fmp1-ink); opacity: .6; }
.fm-p1 .p2-start-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fm-p1 .p2-start-btns .p2-newbtn { min-width: 0; padding: 9px 6px; font-size: 14px; white-space: nowrap; }
.fm-p1 .p2-table tbody tr:has(a[href^="#/"]) { cursor: pointer; }
.fm-p1 .p2-table tbody tr:has(a[href^="#/"]):hover > td { background: var(--fmp1-accent-soft); }
.fm-p1 .p2-rowlink { color: inherit; text-decoration: none; }
.fm-p1 .p2-pad.dh-card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); grid-template-areas: "head head" "pic list" "strip list"; gap: 10px 20px; align-items: start; margin-bottom: 16px; }
.fm-p1 .dh-card > .p2-between { grid-area: head; }
.fm-p1 .dh-pic { grid-area: pic; display: block; border: 1px solid var(--fmp1-line); border-radius: 10px; background: var(--fmp1-bg); overflow: hidden; }
.fm-p1 .dh-pic svg { display: block; width: 100%; height: auto; max-height: 360px; }
.fm-p1 .dh-pic--empty { padding: 28px 16px; text-align: center; }
.fm-p1 .dh-strip { grid-area: strip; display: flex; gap: 8px; flex-wrap: wrap; }
.fm-p1 .dh-mini { margin: 0; width: 130px; border: 1px solid var(--fmp1-line); border-radius: 8px; padding: 4px; background: var(--fmp1-bg); }
.fm-p1 .dh-mini svg { display: block; width: 100%; height: 80px; }
.fm-p1 .dh-mini figcaption { font-size: 12px; text-align: center; }
.fm-p1 .dh-card > .p2-list { grid-area: list; margin: 0; }
.fm-p1 .dh-ok { color: var(--fmp1-good-ink); }
.fm-p1 .ob-block { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 7px; background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); }
.fm-p1 .ob-block .p2-linkbtn { align-self: flex-start; color: inherit; font-weight: 600; }
.fm-p1 .ob-msg { flex-wrap: wrap; gap: 8px 12px; }
.fm-p1 .em-card { grid-column: 1 / -1; }
.fm-p1 .sh-status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; margin-bottom: 14px; border-radius: 10px; border: 1px solid var(--fmp1-line); background: var(--fmp1-surface); border-left: 4px solid var(--fmp1-info); }
.fm-p1 .sh-status.is-warn { border-left-color: var(--fmp1-accent); } .fm-p1 .sh-status.is-alert { border-left-color: var(--fmp1-alert); background: var(--fmp1-alert-soft); } .fm-p1 .sh-status.is-good { border-left-color: var(--fmp1-good); }
.fm-p1 .sh-badge { display: inline-block; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--fmp1-info-soft); color: var(--fmp1-info-ink); font-weight: 600; }
.fm-p1 .sh-badge.is-warn { background: var(--fmp1-accent-soft); color: var(--fmp1-accent-ink); } .fm-p1 .sh-badge.is-alert { background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); } .fm-p1 .sh-badge.is-good { background: var(--fmp1-good-soft); color: var(--fmp1-good-ink); }
.fm-p1 .ob-card .sh-badge { align-self: flex-start; }
.fm-p1 .js-ship { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.fm-p1 .sh-warn { color: var(--fmp1-alert-ink); font-weight: 600; }
.fm-p1 .sh-drop { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px; border: 2px dashed var(--fmp1-line); border-radius: 10px; background: var(--fmp1-bg); }
.fm-p1 .sh-drop.is-over { border-color: var(--fmp1-primary); background: var(--fmp1-accent-soft); }
.fm-p1 .sh-drop textarea { width: 100%; }
.fm-p1 .ml-card { margin-bottom: 14px; }
.fm-p1 .ml-list { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 10px; }
.fm-p1 .ml-item { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--fmp1-line); border-radius: 10px; background: var(--fmp1-bg); }
.fm-p1 .ml-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 280px; }
.fm-p1 .ml-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fm-p1 .ml-pick { display: inline-flex; gap: 6px; align-items: center; }
.fm-p1 .ml-pick select { max-width: 240px; }
.fm-p1 .ml-filed li { align-items: baseline; }
.fm-p1 .ml-sim { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--fmp1-line); }
.fm-p1 .ml-sim textarea { width: 100%; margin: 8px 0; }
.fm-p1 .ml-drop { cursor: pointer; margin-top: 8px; }
.fm-p1 .sh-read { display: flex; flex-direction: column; gap: 10px; }
.fm-p1 .sh-houses { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.fm-p1 .sh-order { margin-top: 14px; }
.fm-p1 .sh-ships { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fm-p1 .sh-ship { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--fmp1-line); border-radius: 9px; background: var(--fmp1-bg); }
.fm-p1 .sh-lines { margin: 6px 0 0; padding-left: 18px; }
.fm-p1 .sh-claim { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--fmp1-line); }
.fm-p1 .sh-claim:first-of-type { border-top: 0; }
.fm-p1 .sh-sheet { border: 2px solid var(--fmp1-accent); margin-bottom: 14px; }
.fm-p1 .sh-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
.fm-p1 .rv { max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.fm-p1 .rv-head { display: flex; flex-direction: column; gap: 2px; }
.fm-p1 .rv-head .fmp1-btn { align-self: flex-start; margin-bottom: 6px; }
.fm-p1 .rv-rules { padding: 12px 14px; border-radius: 10px; background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); }
.fm-p1 .rv-rules ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.fm-p1 .rv-big { min-height: 52px; font-size: 16px; justify-content: center; width: 100%; }
.fm-p1 .rv-q { margin: 4px 0 0; font-weight: 600; }
.fm-p1 .rv-yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fm-p1 .rv-count { display: flex; flex-direction: column; align-items: center; padding: 14px; border-radius: 12px; background: var(--fmp1-info-soft); color: var(--fmp1-info-ink); }
.fm-p1 .rv-count b { font-size: 22px; font-family: var(--fmp1-font-display); } .fm-p1 .rv-count.is-late { background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); }
.fm-p1 .rv-group { border: 1px solid var(--fmp1-line); border-radius: 10px; padding: 10px 12px; background: var(--fmp1-surface); }
.fm-p1 .rv-group.is-ok { border-color: var(--fmp1-good); }
.fm-p1 .rv-group ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fm-p1 .rv-group li { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.fm-p1 .rv-check, .fm-p1 .rv-warn { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--fmp1-line); background: var(--fmp1-bg); color: var(--fmp1-ink); font-size: 20px; cursor: pointer; }
.fm-p1 .rv-check[aria-pressed="true"] { background: var(--fmp1-good); border-color: var(--fmp1-good); color: #fff; }
.fm-p1 .rv-warn { color: var(--fmp1-alert-ink); }
.fm-p1 .sh-cam { min-height: 48px; }
.fm-p1-doc .sh-qr { position: absolute; top: 0.45in; right: 0.55in; width: 0.9in; height: 0.9in; }
.fm-p1-doc.sh-photos { gap: 14pt; }
.fm-p1-doc.sh-photos figure { margin: 0; flex: 1 1 0; display: flex; flex-direction: column; gap: 4pt; min-height: 0; }
.fm-p1-doc.sh-photos img { width: 100%; max-height: 4.3in; object-fit: contain; border: 0.5pt solid var(--doc-line); }
.fm-p1-doc.sh-photos figcaption { font-size: 9pt; font-weight: 600; }
.fm-p1 .co-next { list-style: none; counter-reset: con; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.fm-p1 .co-next > li, .fm-p1 .p2-list .co-next > li { counter-increment: con; position: relative; padding: 2px 0 0 38px; border-top: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; justify-content: flex-start; font-size: 14px; }
.fm-p1 .p2-list .sg-who li, .fm-p1 .p2-list .sg-coblock .sg-errs li { display: list-item; padding: 2px 0; border-top: 0; }
.fm-p1 .co-next > li::before { content: counter(con); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--fmp1-primary); color: var(--fmp1-on-primary); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.fm-p1 .co-next > li > * { max-width: 100%; }
.fm-p1 .sg-who { width: 100%; padding: 10px 12px; border: 1px solid var(--fmp1-line); border-radius: 9px; background: var(--fmp1-surface); }
.fm-p1 .sg-whogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
.fm-p1 .sg-who [aria-invalid="true"] { border-color: var(--fmp1-alert); box-shadow: 0 0 0 1px var(--fmp1-alert); }
.fm-p1 .co-moves summary { cursor: pointer; font-weight: 600; }
.fm-p1 .cl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fm-p1 .cl-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 7px; border: 1px solid var(--fmp1-line); border-radius: 999px; background: var(--fmp1-surface); color: var(--fmp1-ink); font: inherit; font-size: 13.5px; cursor: pointer; }
.fm-p1 .cl-chip i, .fm-p1 .cl-cat i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); flex: none; }
.fm-p1 .cl-chip[aria-pressed="true"] { border-color: var(--fmp1-primary); box-shadow: inset 0 0 0 1.5px var(--fmp1-primary); font-weight: 600; }
.fm-p1 .cl-chip:disabled { opacity: .6; cursor: default; }
.fm-p1 .cl-add { border-style: dashed; padding-left: 12px; color: var(--fmp1-accent-ink); font-weight: 600; }
.fm-p1 .cl-chip:focus-visible, .fm-p1 .cl-cat:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 2px; }
.fm-p1 .cl-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding: 12px; border: 1px solid var(--fmp1-line); border-radius: 10px; background: var(--fmp1-bg); }
.fm-p1 .cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; max-height: 320px; overflow: auto; padding: 2px; }
.fm-p1 .cl-cat { display: grid; grid-template-columns: 28px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 7px 9px; border: 1px solid var(--fmp1-line); border-radius: 8px; background: var(--fmp1-surface); color: var(--fmp1-ink); font: inherit; cursor: pointer; }
.fm-p1 .cl-cat i { grid-row: 1 / 3; width: 28px; height: 28px; border-radius: 6px; }
.fm-p1 .cl-cat b { font-size: 13px; font-weight: 600; }
.fm-p1 .cl-cat span { font-size: 11.5px; opacity: .7; }
.fm-p1 .cl-cat:hover { border-color: var(--fmp1-primary); }
.fm-p1 .cl-picker { width: 56px; height: 36px; padding: 2px; border: 1px solid var(--fmp1-line); border-radius: 8px; background: var(--fmp1-surface); }
.fm-p1 .em-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.fm-p1 .em-chip { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 9px 12px; border: 1px solid var(--fmp1-line); border-radius: 9px; background: var(--fmp1-bg); color: var(--fmp1-ink); font: inherit; font-size: 14px; cursor: pointer; }
.fm-p1 .em-chip span { font-size: 12.5px; opacity: .75; }
.fm-p1 .em-chip:hover { border-color: var(--fmp1-primary); }
.fm-p1 .em-chip[aria-pressed="true"] { border-color: var(--fmp1-primary); box-shadow: inset 0 0 0 1px var(--fmp1-primary); background: var(--fmp1-accent-soft); }
.fm-p1 .em-chip:focus-visible, .fm-p1 .em-tbtn:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 2px; }
.fm-p1 .em-other { max-width: 320px; }
.fm-p1 .em-draft { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--fmp1-line); }
.fm-p1 .em-body { font-family: var(--fmp1-font-body); font-size: 14px; line-height: 1.5; resize: vertical; }
.fm-p1 .em-tgrid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 12px; }
.fm-p1 .em-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fm-p1 .em-tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.fm-p1 .em-tbtn { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--fmp1-ink); font: inherit; font-size: 14px; cursor: pointer; }
.fm-p1 .em-tbtn > .p2-small { flex-basis: 100%; }
.fm-p1 .em-tbtn:hover { background: var(--fmp1-surface); }
.fm-p1 .em-tbtn.is-on { background: var(--fmp1-surface); border-color: var(--fmp1-line); box-shadow: inset 3px 0 0 var(--fmp1-primary); }
.fm-p1 .em-prev { white-space: pre-wrap; font-family: var(--fmp1-font-body); font-size: 14px; line-height: 1.55; margin: 0; padding: 12px 14px; border: 1px solid var(--fmp1-line); border-radius: 8px; background: var(--fmp1-bg); }
@media (max-width: 760px) { .fm-p1 .em-tgrid { grid-template-columns: 1fr; } }
.fm-p1 .dh-no { color: var(--fmp1-alert-ink); }
@media (max-width: 760px) { .fm-p1 .p2-pad.dh-card { grid-template-columns: 1fr; grid-template-areas: "head" "pic" "strip" "list"; } }
.fm-p1 .p2-rowlink:hover, .fm-p1 .p2-rowlink:focus-visible { text-decoration: underline; }
/* one document list: each row is the control */
.fm-p1 .p2-docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
.fm-p1 .p2-docrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--fmp1-ink); background: var(--fmp1-surface); border: 1px solid var(--fmp1-line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.fm-p1 .p2-docrow:hover { border-color: var(--fmp1-accent); background: var(--fmp1-surface-2); }
.fm-p1 .p2-docrow:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 2px; }
.fm-p1 .p2-docicon { flex: none; width: 30px; height: 36px; border-radius: 4px; border: 1.5px solid var(--fmp1-ink-3); position: relative; }
.fm-p1 .p2-docicon::after { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; height: 12px; border-top: 1.5px solid var(--fmp1-ink-3); border-bottom: 1.5px solid var(--fmp1-ink-3); }
.fm-p1 .p2-doctext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fm-p1 .p2-doctext b { font-size: 14px; }
.fm-p1 .p2-docopen { margin-left: auto; flex: none; font-size: 13px; font-weight: 600; color: var(--fmp1-accent-ink); }
.fm-p1 .p2-main { min-width: 0; padding: 22px 28px 64px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.fm-p1 .p2-main > * { max-width: 1180px; width: 100%; }
.fm-p1 .p2-main > .pv-viewer { max-width: none; }
.fm-p1 .p2-h1 { font-size: 28px; }
.fm-p1 .p2-sub { color: var(--fmp1-ink-2); font-size: 14px; max-width: 72ch; }
.fm-p1 .p2-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fm-p1 .p2-between { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.fm-p1 .p2-pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fm-p1 .p2-small { font-size: 12.5px; }
.fm-p1 .p2-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start; }
.fm-p1 .p2-head { min-width: 0; }
.fm-p1 .p2-between > .p2-head { flex: 1 1 420px; }
.fm-p1 .p2-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
