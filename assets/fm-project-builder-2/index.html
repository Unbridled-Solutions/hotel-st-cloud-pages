<style>
/* Phase 2 app (preview). Everything is scoped to .fm-p1; .p2-* classes are this app's layout. */
:root { --page: #EFE8DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #243A32; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #243A32; color-scheme: dark; }
body { margin: 0; background: var(--page); }
#p2 { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); background: var(--fmp1-bg); }
.fm-p1 p { margin: 0; }
.fm-p1 .p2-side { position: sticky; top: 0; max-height: 100vh; align-self: start; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 20px 14px 16px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); background: var(--fmp1-surface); border-right: 1px solid var(--fmp1-line); }
.fm-p1 .p2-brand { display: flex; flex-direction: column; gap: 4px; padding: 0 6px; }
.fm-p1 .p2-brand .fmp1-logo--tagline { height: 46px; }
.fm-p1 .p2-nav { display: flex; flex-direction: column; gap: 2px; }
/* Section headings (Projects, Company books, Company) read as headings: full ink, bold, a rule underneath, room above. */
.fm-p1 .p2-nav h2 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--fmp1-ink); font-weight: 700; margin: 0 0 6px; padding: 0 10px 7px; border-bottom: 1px solid var(--fmp1-line); }
.fm-p1 .p2-nav + .p2-nav { margin-top: 10px; }
.fm-p1 .p2-nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--fmp1-ink-2); text-decoration: none; font-size: 13.5px; }
.fm-p1 .p2-nav a:hover { background: var(--fmp1-surface-2); color: var(--fmp1-ink); }
.fm-p1 .p2-nav a[aria-current="page"] { background: var(--fmp1-accent-soft); color: var(--fmp1-ink); font-weight: 600; }
.fm-p1 .p2-nav a:focus-visible, .fm-p1 .p2-tabs a:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 1px; }
.fm-p1 .p2-nav .count { font-size: 11px; font-weight: 700; background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); border-radius: 999px; padding: 1px 7px; }
.fm-p1 .p2-side-foot { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--fmp1-line); display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.fm-p1 .p2-side-foot .fmp1-theme { display: flex; }
.fm-p1 .p2-side-foot .fmp1-theme button { flex: 1 1 0; padding: 7px 12px; }   /* the two halves fill the box: no empty strip beside Dark */
#p2 { background: linear-gradient(to right, var(--fmp1-surface) 236px, var(--fmp1-bg) 236px); }
.fm-p1 .p2-newbtn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border-radius: 9px; background: var(--fmp1-primary); color: var(--fmp1-on-primary); font-weight: 600; font-size: 14px; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.fm-p1 .p2-newbtn:hover { filter: brightness(1.08); }
.fm-p1 .p2-newbtn[aria-current="page"] { outline: 2px solid var(--fmp1-accent); outline-offset: 2px; }

.fm-p1 .p2-newbtn span { font-size: 17px; line-height: 1; }
/* one document list: each row is the control */

.fm-p1 .p2-doctext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fm-p1 .p2-doctext b { font-size: 14px; }

.fm-p1 .p2-main { min-width: 0; padding: 22px 28px 64px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }

.fm-p1 .p2-h1 { font-size: 28px; }

.fm-p1 .p2-small { font-size: 12.5px; }

/* field measure (built for a phone first) */

.fm-p1 .p2-ms-wall { padding: 0; overflow: hidden; }
.fm-p1 .p2-ms-wallhead { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; cursor: pointer; min-height: 52px; flex-wrap: wrap; }

.fm-p1 .pv-pdf { width: 100%; height: calc(100vh - 150px); min-height: 480px; border: 1px solid var(--fmp1-line); border-radius: 8px; background: #fff; }

/* links: the app's ink color with a soft underline, never the browser's blue or visited purple */
.fm-p1 .p2-main a:not(.fmp1-btn):not(.p2-ms-row):not(.p2-cu-job) { color: var(--fmp1-ink); text-decoration: underline; text-decoration-color: var(--fmp1-line); text-underline-offset: 3px; text-decoration-thickness: 1px; }

.fm-p1 a.fmp1-btn { text-decoration: none; }

.fm-p1 .p2-tasks { list-style: none; margin: 0; padding: 0; }

.fm-p1 .p2-task:first-child { border-top: 0; }
.fm-p1 .p2-task-status { min-width: 74px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--fmp1-surface-2); color: var(--fmp1-ink-2); white-space: nowrap; }

.fm-p1 .p2-task-who { font-size: 13px; color: var(--fmp1-ink-2); }

.fm-p1 .p2-task-amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 90px; text-align: right; }
.fm-p1 .p2-task-btn { white-space: nowrap; min-width: 150px; justify-content: center; text-align: center; }
@media (max-width: 640px) { .fm-p1 .p2-task { grid-template-columns: minmax(0, 1fr) auto; } .fm-p1 .p2-task-status { grid-column: 1 / -1; justify-self: start; min-width: 0; } .fm-p1 .p2-task-main { grid-column: 1 / -1; }
  .fm-p1 .p2-task-amt { grid-column: 1; text-align: left; min-width: 0; } .fm-p1 .p2-task-btn { grid-column: 2; min-width: 0; } }

}

.fm-p1 .p2-jobhead { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
