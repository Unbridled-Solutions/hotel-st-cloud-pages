<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Willow Creek Quote Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="src/fm-phase1-theme.css">
<link rel="stylesheet" href="src/fm-phase1-print.css">
<style>
/* Preview page only. Shipped pieces: src/fm-phase1-quote.js and src/fm-phase1-print.css. */
:root { --page: #EFE8DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #131C18; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #131C18; color-scheme: dark; }
body { margin: 0; background: var(--page); }
#qp-root > :not(#qp-measure) { width: 100%; max-width: 1380px; margin-inline: auto; }
#qp-root { min-height: 100vh; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.fm-p1 .qp-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--fmp1-line); padding-bottom: 14px; }
.fm-p1 .qp-h1 { font-size: 28px; margin: 4px 0; }
.fm-p1 .qp-brand { display: flex; gap: 14px; align-items: flex-start; }
.fm-p1 .qp-brand .fmp1-logo--mark { height: 52px; margin-top: 2px; }
.fm-p1 .qp-intro { margin: 0; max-width: 70ch; }
.fm-p1 .qp-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.fm-p1 .qp-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.fm-p1 .qp-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fm-p1 .qp-pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fm-p1 .qp-big { font-size: 22px; font-weight: 600; margin: 0; }
.fm-p1 .qp-small { font-size: 12.5px; margin: 0; }
.fm-p1 .qp-list { margin: 6px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px; }
.fm-p1 .qp-seg { display: flex; gap: 6px; flex-wrap: wrap; }
.fm-p1 .qp-dl { margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.fm-p1 .qp-dl div { display: flex; flex-direction: column; }
.fm-p1 .qp-dl dt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--fmp1-ink-3); font-weight: 600; }
.fm-p1 .qp-dl dd { margin: 0; font-variant-numeric: tabular-nums; }
.fm-p1 .qp-dl dd span { display: block; font-size: 12px; color: var(--fmp1-ink-2); }
.fm-p1 .qp-paper { overflow-x: auto; min-width: 0; padding: 4px; }
.fm-p1 .qp-paper .fm-p1-doc { box-shadow: var(--fmp1-shadow); margin: 0 auto; }
#qp-measure { position: absolute; left: -10000px; top: 0; width: 8.5in; visibility: hidden; }
@media (max-width: 900px) { .fm-p1 .qp-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="qp-root" class="fm-p1" aria-live="polite"></div>
<script src="src/fm-phase1-theme-toggle.js"></script>
<script src="src/fm-phase1-ledger.js"></script>
<script src="src/fm-phase1-quote.js"></script>
<script src="preview/willow-creek-full-order.js"></script>
<script src="preview/quote-preview.js"></script>
</body>
</html>
