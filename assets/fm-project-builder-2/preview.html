<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Builder Phase 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="src/fm-phase1-theme.css">
<link rel="stylesheet" href="src/fm-phase1-print.css">
<style>
/* Preview page only. The shipped module is src/ — this file is a demo harness. */
:root { --page: #EFE8DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #131C18; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #131C18; color-scheme: dark; }
body { margin: 0; background: var(--page); }
#fmp1-root > * { width: 100%; max-width: 1180px; margin-inline: auto; }
#fmp1-root { padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
.fm-p1 .pv-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--fmp1-line); }
.fm-p1 .pv-brand { display: flex; gap: 12px; align-items: center; }
.fm-p1 .pv-brand > div:last-child { display: flex; flex-direction: column; }
.fm-p1 .pv-mark { width: 34px; text-align: center; font-family: var(--fmp1-font-display); font-weight: 700; font-size: 16px; line-height: 1; color: var(--fmp1-ink); }
.fm-p1 .pv-mark span { display: block; padding: 3px 0; }
.fm-p1 .pv-mark span + span { border-top: 1.5px solid var(--fmp1-ink); }
.fm-p1 .pv-word { font-family: var(--fmp1-font-display); letter-spacing: .06em; font-size: 16px; }
.fm-p1 .pv-intro { margin: 0; max-width: 72ch; }
.fm-p1 .pv-small { font-size: 12px; }
.fm-p1 .pv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fm-p1 .pv-h2 { font-size: 24px; }
.fm-p1 .pv-h3 { font-size: 19px; }
.fm-p1 .pv-sec { display: flex; flex-direction: column; gap: 12px; }
.fm-p1 .pv-pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fm-p1 .pv-proposal { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-color: var(--fmp1-alert); box-shadow: var(--fmp1-shadow); }
.fm-p1 .pv-proposal-head { display: flex; flex-direction: column; gap: 6px; }
.fm-p1 .pv-proposal-head p { margin: 0; max-width: 75ch; }
.fm-p1 .pv-reasons, .fm-p1 .pv-warn { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--fmp1-ink-2); }
.fm-p1 .pv-dates { border: 1px solid var(--fmp1-line); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; margin: 0; font-size: 13px; }
.fm-p1 .pv-dates legend { padding: 0 4px; }
.fm-p1 .pv-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.fm-p1 .pv-kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.fm-p1 .pv-kpi-v { font-size: 20px; font-weight: 600; }
.fm-p1 .pv-list { min-width: 760px; }
.fm-p1 .pv-list tr.is-sel td { background: var(--fmp1-accent-soft); }
.fm-p1 .pv-list tr.is-lost td { color: var(--fmp1-ink-3); }
.fm-p1 .pv-jobhead { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.fm-p1 .pv-jh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fm-p1 .pv-jh-top > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fm-p1 .pv-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.fm-p1 .pv-act { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fm-p1 .pv-actform { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background: var(--fmp1-surface-2); padding: 10px 12px; border-radius: 8px; width: 100%; }
.fm-p1 .pv-actform > b { align-self: center; }
.fm-p1 .pv-fl { display: flex; flex-direction: column; gap: 3px; }
.fm-p1 .pv-grow { flex: 1; min-width: 180px; }
.fm-p1 .pv-err { color: var(--fmp1-alert-ink); font-size: 12.5px; font-weight: 600; align-self: center; }
.fm-p1 .pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
.fm-p1 .pv-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fm-p1 .pv-htable { min-width: 980px; }
.fm-p1 .pv-hrow.is-open td { background: var(--fmp1-accent-soft); }
.fm-p1 .pv-tog { padding: 2px 4px; font-weight: 600; color: var(--fmp1-ink); }
.fm-p1 .pv-skus > td { background: var(--fmp1-surface-2); padding: 6px 10px 12px; }
.fm-p1 .pv-skus .fmp1-table { background: var(--fmp1-surface); border-radius: 8px; }
.fm-p1 .pv-atcost td { background: var(--fmp1-alert-soft); }
.fm-p1 .pv-removed td { color: var(--fmp1-ink-3); }
.fm-p1 .pv-removed td:nth-child(-n+2) { text-decoration: line-through; }
.fm-p1 .pv-docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fm-p1 .pv-doc { border: 1px solid var(--fmp1-line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.fm-p1 .pv-doc-head { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.fm-p1 .pv-doc-icon { flex: none; font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 6px 5px; border-radius: 4px; background: var(--fmp1-alert-soft); color: var(--fmp1-alert-ink); }
.fm-p1 .pv-doc-notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.fm-p1 .pv-doc-alert { color: var(--fmp1-alert-ink); }
.fm-p1 .pv-doc-good { color: var(--fmp1-good-ink); }
.fm-p1 .pv-chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; align-self: center; }
.fm-p1 .pv-col-form { flex-direction: column; align-items: stretch; }
.fm-p1 .pv-sched-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px; gap: 8px; align-items: center; font-size: 13px; }
.fm-p1 .pv-tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fm-p1 .pv-tl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--fmp1-line); font-size: 13px; }
.fm-p1 .pv-tl-when { font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.fm-p1 .pv-pinned { background: var(--fmp1-accent-soft); border-radius: 8px; padding: 8px 12px; }
.fm-p1 .pv-pinned .pv-tl { border-top-color: transparent; }
.fm-p1 .pv-csv { margin: 0; max-height: 220px; overflow: auto; background: var(--fmp1-surface-2); border-radius: 8px; padding: 10px; font-family: var(--fmp1-font-mono); font-size: 11px; white-space: pre; }
.fm-p1 .pv-linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--fmp1-accent-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }
.fm-p1 .pv-linkbtn:focus-visible { outline: 2px solid var(--fmp1-focus); outline-offset: 2px; border-radius: 3px; }
.fm-p1 .pv-viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: rgba(20, 30, 26, .94); }
.fm-p1 .pv-viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--fmp1-surface); border-bottom: 1px solid var(--fmp1-line); }
.fm-p1 .pv-viewer-bar b { font-family: var(--fmp1-font-display); font-size: 16px; min-width: 0; }
.fm-p1 .pv-viewer-body { flex: 1; overflow: auto; padding: 24px 16px 48px; overscroll-behavior: contain; }
.fm-p1 .pv-viewer-body .fm-p1-doc { margin: 0 auto 20px; box-shadow: 0 2px 14px rgba(0, 0, 0, .35); }
.fm-p1 .pv-filenote { max-width: 640px; margin: 0 auto; gap: 8px; }
.fm-p1 .pv-filenote .fmp1-code { white-space: normal; overflow-wrap: anywhere; }
 print {
  body { background: #fff !important; }
  #fmp1-root { padding: 0 !important; }
  #fmp1-root.fm-p1 > :not(.pv-viewer) { display: none !important; }
  .fm-p1 .pv-viewer { position: static; background: none; display: block; }
  .fm-p1 .pv-viewer-bar { display: none; }
  .fm-p1 .pv-viewer-body { padding: 0; overflow: visible; }
  .fm-p1 .pv-viewer-body .fm-p1-doc { margin: 0; box-shadow: none; zoom: 1 !important; }
}
@media (max-width: 640px) {
  .fm-p1 .pv-sched-row { grid-template-columns: 1fr 1fr; } .fm-p1 .pv-sched-row > span { grid-column: 1 / -1; }
  .fm-p1 .pv-tl { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 640px) { .fm-p1 .fmp1-stages { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; } }
</style>
</head>
<body>
<div id="fmp1-root" class="fm-p1" aria-live="polite"></div>
<script src="src/fm-phase1-theme-toggle.js"></script>
<script src="src/fm-phase1-ledger.js"></script>
<script src="src/fm-phase1-activity.js"></script>
<script src="src/fm-phase1-pricing.js"></script>
<script src="src/fm-phase1-quote.js"></script>
<script src="src/fm-phase2-agreement.js"></script>
<script src="src/fm-phase1-docs.js"></script>
<script src="preview/braddy-penrose-order.js"></script>
<script src="preview/willow-creek-full-order.js"></script>
<script src="preview/sample-data.js"></script>
<script src="preview/app.js"></script>
</body>
</html>
