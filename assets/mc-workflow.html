<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>The MC system · How work gets done</title>
<style>
:root { --bg:#0f1923; --gold:#c9aa7c; --text:#e8e0d4; --muted:#8a9aaa; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
.bar { padding:16px 22px 12px; border-bottom:2px solid var(--gold); }
.kicker { font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold); font-weight:700; }
h1 { font-size:22px; margin:6px 0 4px; }
.lede { color:var(--muted); font-size:14px; max-width:720px; line-height:1.45; }
.pic { padding:18px 12px 48px; max-width:980px; margin:0 auto; }
.pic img { width:100%; height:auto; display:block; background:#efe8d8; }
.note { font-size:13px; color:var(--muted); margin:12px 12px 0; line-height:1.5; }
.note a { color:var(--gold); }
</style>
</head>
<body>
  <div class="bar">
    <div class="kicker">Unbridled · Training · Private</div>
    <h1>The MC system</h1>
    <p class="lede">Put this next to the Grok Bot org chart. Same lesson: chief of staff, specialists, verify. Different machine: you stay in the room, and the deliverable is a live URL.</p>
  </div>
  <div class="pic">
    <img src="commander-week1/mc-workflow.png" alt="The MC system: You talk, MC assigns, crew builds, you gate, live URL">
    <p class="note">Grok pictures: <a href="commander-week1">commander-week1</a> · Proof of work: <a href="mc-week-examples">mc-week-examples</a></p>
  </div>
</body>
</html>
