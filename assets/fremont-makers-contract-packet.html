<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fremont Makers — Contract Packet v0917k</title>
  <!-- FM-PACKET-v0917k-labor-total -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Pinyon+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1a1a1a; --muted:#666; --line:#d8d4cc; --gold:#c9a84c; --paper:#fff; --screen:#111; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--screen); color: #f0ece4; font-size: 14px; line-height: 1.5; }
    .bar { background:#0d0d0d; border-bottom:1px solid #2a2a2a; padding:12px 18px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; position:sticky; top:0; z-index:5; }
    .bar strong { letter-spacing:.14em; text-transform:uppercase; font-size:11px; color:var(--gold); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .actions button, .actions a {
      background:transparent; color:var(--gold); border:1px solid #2a2a2a; border-radius:6px;
      padding:8px 12px; font-size:13px; cursor:pointer; text-decoration:none; font-family:inherit;
    }
    .save-ok { font-size:12px; color:#7dba7d; min-width:8rem; }
    .wrap { max-width:820px; margin:0 auto; padding:18px 16px 72px; }
    .err { background:#2a1515; border:1px solid #8a3a3a; color:#f0c8c8; padding:14px 16px; border-radius:10px; margin:16px 0; }
    .page {
      background: var(--paper); color: var(--ink); border-radius: 4px; padding: 36px 40px 40px;
      margin: 0 auto 18px; min-height: 10.4in; position: relative; page-break-after: always;
    }
    .page:last-child { page-break-after: auto; }
    .logo { height: 52px; width: auto; display: block; margin: 0 auto 6px; }
    .kicker { text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#888; margin-bottom:18px; }
    h1 { font-family:'Playfair Display', Georgia, serif; font-size:26px; text-align:center; margin-bottom:4px; }
    .tag { font-family:'Pinyon Script', cursive; text-align:center; color:#888; font-size:18px; margin-bottom:22px; }
    h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#8a7328; margin:18px 0 8px; }
    p { margin-bottom:10px; }
    .meta { display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; font-size:14px; margin-bottom:14px; }
    .meta b { display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#888; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#888; padding:7px 4px; border-bottom:1px solid var(--line); }
    td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.r, th.r { text-align:right; white-space:nowrap; }
    .tot { width:280px; margin-left:auto; margin-top:12px; }
    .tot td { border:none; padding:4px 0; }
    .tot tr:last-child td { font-weight:700; font-size:15px; border-top:1px solid var(--ink); padding-top:8px; }
    .sig { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:28px; }
    .sig-line { border-bottom:1px solid #bbb; padding-top:34px; font-size:11px; color:#888; }
    .paid { position:absolute; top:90px; right:36px; transform:rotate(-12deg); border:3px solid #1a7a3a; color:#1a7a3a; font-weight:700; letter-spacing:.2em; padding:6px 14px; font-size:22px; }
    .note { font-size:12px; color:#555; margin-top:10px; }
    .fine { font-size:12px; color:#555; }
    @media (max-width:700px) { .page { padding:22px 16px; } .meta, .sig { grid-template-columns:1fr; } }
    @media print {
      .bar { display:none !important; }
      body { background:#fff; color:#111; }
      .wrap { padding:0; max-width:none; }
      .page { box-shadow:none; margin:0; border-radius:0; min-height:auto; }
      .err { display:none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Fremont Makers · Contract packet <span style="opacity:.45;letter-spacing:0;">v0917k</span></strong>
    <div class="actions">
      <span class="save-ok" id="save-msg"></span>
      <button type="button" onclick="window.print()">Print</button>
      <a href="https://tools.fremontmakers.com/quote">Project Builder</a>
    </div>
  </div>
  <div class="wrap" id="root">
    <div class="err" id="load-msg">Loading quote from the cloud…</div>
  </div>
<script>
const CLOUD = '/api/planner/bundle?ns=fm-quotes';
const LOGO = '/assets/fremontmakers-logo.png';
let Q = null;
let MODE = { invoice: 0, receipt: '' };

function qs() {
  const p = new URLSearchParams(location.search);
  return {
    id: p.get('id') || '',
    invoice: parseInt(p.get('invoice') || '0', 10) || 0,
    receipt: (p.get('receipt') || '').toLowerCase()
  };
}
function money(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function invAmt(ar, total, n, pct) {
  const v = ar && ar['d' + n + 'Amt'];
  if (v != null && v !== '') return Math.round(Number(v) * 100) / 100;
  return Math.round(total * pct * 100) / 100;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseQ(raw) {
  if (!raw) return null;
  if (typeof raw === 'string') {
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  return typeof raw === 'object' ? raw : null;
}
function quoteGrand(qd) {
  if (!qd) return 0;
  const cabSell = (qd.cabinets || []).reduce((s, c) => s + (parseFloat(c.qty)||0) * (parseFloat(c.cost)||0) * (1 + (parseFloat(c.markup)||0)/100), 0);
  const cabNet  = (qd.cabinets || []).reduce((s, c) => s + (parseFloat(c.qty)||0) * (parseFloat(c.cost)||0), 0);
  const laborCost = (qd.labor || []).reduce((s, l) => s + (parseFloat(l.rate)||0) * (parseFloat(l.hours)||0), 0);
  const gnaPct = parseFloat(qd.gnaPct) || 0;
  const taxPct = parseFloat(qd.taxPct) || 0;
  const bulkDisc = parseFloat(qd.bulkDiscPct) || 0;
  const cabAfterDisc = cabSell - cabNet * bulkDisc/100;
  const tax = cabAfterDisc * taxPct / 100;
  const gna = (cabAfterDisc + laborCost) * gnaPct / 100;
  return {
    cabSell, cabNet, cabAfterDisc, laborCost, gna, tax,
    unit: cabAfterDisc + laborCost + gna + tax,
    gnaPct, taxPct, bulkDisc
  };
}
function modelQty(qd) {
  const n = parseInt(qd && qd.modelQty, 10);
  return n > 0 ? n : 1;
}
function childrenOf(q, data) {
  if (!q || !(q.kind === 'order' || q.isOrder)) return [];
  const ids = q.childIds || [];
  const out = [];
  ids.forEach(id => {
    const c = parseQ(data['fm-quote-' + id]);
    if (c) out.push(c);
  });
  if (out.length) return out;
  Object.keys(data).forEach(k => {
    if (!k.startsWith('fm-quote-')) return;
    const c = parseQ(data[k]);
    if (c && c.parentOrderId === q.id) out.push(c);
  });
  return out.sort((a, b) => ((a.modelName || '') + String(a.unitIndex || 0)).localeCompare((b.modelName || '') + String(b.unitIndex || 0)));
}
function mixLabel(kids) {
  const counts = {};
  kids.forEach(k => {
    const n = k.modelName || k.project || 'House';
    counts[n] = (counts[n] || 0) + 1;
  });
  return Object.keys(counts).map(n => counts[n] + ' ' + n).join(', ') || (kids.length + ' houses');
}
function orderTotal(q, kids) {
  if (!(q.kind === 'order' || q.isOrder)) return quoteGrand(q).unit * modelQty(q);
  return kids.reduce((s, c) => s + quoteGrand(c).unit * modelQty(c), 0);
}
function pageOrderCover(q, kids, total) {
  const mix = mixLabel(kids);
  const rows = kids.map(c => {
    const n = quoteGrand(c);
    return '<tr><td>' + esc(c.project || c.modelName || '') + '</td><td>' + esc(c.jobCode || '') + '</td><td class="r">' + money(n.unit * modelQty(c)) + '</td></tr>';
  }).join('');
  return '<div class="page">' + head('Builder order')
    + '<h1>Builder Order</h1><div class="tag">making freedom</div>'
    + '<div class="meta">'
    + '<div><b>Buyer</b>' + esc(q.customer || '') + (q.signerName ? '<div class="fine">' + esc(q.signerName) + '</div>' : '') + '</div>'
    + '<div><b>This contract</b>' + esc(mix) + '</div>'
    + '<div><b>Job</b>' + esc(q.jobCode || '') + '</div>'
    + '<div><b>Quote date</b>' + esc(prettyDate(q.date)) + '</div>'
    + '<div><b>Install / delivery</b>' + esc(prettyDate(q.installDate)) + '</div>'
    + '<div><b>Contract total</b>' + money(total) + '</div>'
    + '</div>'
    + '<p>This packet is one contract for the mix above. Each house has its own Final Job Quote as an exhibit. Color and SKU may differ by house. Dollars and the 50 / 30 / 20 schedule live on this order, not on each exhibit.</p>'
    + '<h2>Houses on this order</h2>'
    + '<table><thead><tr><th>House</th><th>Job</th><th class="r">Amount</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="3">No houses</td></tr>')
    + '</tbody></table>'
    + '<table class="tot"><tbody><tr><td>Order total</td><td class="r">' + money(total) + '</td></tr></tbody></table>'
    + '</div>';
}
function pageQuoteExhibit(c) {
  const nums = quoteGrand(c);
  const labeled = Object.assign({}, c, { project: (c.project || c.modelName || 'House') });
  return pageQuote(labeled, nums).replaceAll('Final Job Quote', 'Final Job Quote · ' + esc(c.project || c.modelName || 'House'));
}
function prettyDate(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function logo() {
  return '<img class="logo" src="' + LOGO + '" alt="Fremont Makers" />';
}
function head(label) {
  return logo() + '<div class="kicker">' + esc(label) + '</div>';
}
function jobMeta(q, nums) {
  const qty = modelQty(q);
  return '<div class="meta">'
    + '<div><b>Buyer</b>' + esc(q.customer || '') + (q.signerName ? '<div class="fine">' + esc(q.signerName) + '</div>' : '') + '</div>'
    + '<div><b>Project</b>' + esc(q.project || '') + '</div>'
    + '<div><b>Job</b>' + esc(q.jobCode || '') + '</div>'
    + '<div><b>Quote date</b>' + esc(prettyDate(q.date)) + '</div>'
    + '<div><b>Install / delivery</b>' + esc(prettyDate(q.installDate)) + '</div>'
    + '<div><b>Site</b>' + esc(q.address || '—') + '</div>'
    + (qty > 1 ? '<div><b>Quantity</b>' + qty + ' of this model · unit ' + money(nums.unit) + '</div><div><b>Contract total</b>' + money(nums.unit * qty) + '</div>' : '<div><b>Contract total</b>' + money(nums.unit * qty) + '</div>')
    + '</div>';
}
function pageAgreement(q, nums) {
  const total = nums.unit * modelQty(q);
  const signer = q.signerName || q.customer || '';
  return '<div class="page">' + head('Customer Sales Agreement')
    + '<h1>Fremont Makers</h1><div class="tag">making freedom</div>'
    + jobMeta(q, nums)
    + '<h2>Parties and Entire Agreement</h2>'
    + '<p>Seller is Fremont Makers LLC, a Colorado limited liability company, 719 Main Street, Cañon City, CO 81212. Buyer is ' + esc(q.customer || 'the buyer named above') + (q.signerName ? ' (' + esc(q.signerName) + ')' : '') + '. This Agreement, the Quote, the Payment Schedule, and the three invoices in this packet are the entire deal. Dollars live on the invoices and the Final Job Quote. Pricing is by bid.</p>'
    + '<h2>Goods</h2>'
    + '<p>Seller sells the ready-to-assemble cabinets and hardware listed on the Final Job Quote. Unless the Quote says otherwise in writing: no design professional services, no field measuring, no install into the building, no plumbing, no electrical, no countertops, no appliances.</p>'
    + '<h2>Nature of Seller</h2>'
    + '<p>Seller is a reseller, not the manufacturer. Most items ship from warehouses in the United States. Out-of-stock orders may take longer because some product originates overseas. Lead times are estimates. Manufacturing or freight delay is not a breach if Seller keeps Buyer reasonably informed.</p>'
    + '<h2>Payment Terms</h2>'
    + '<p>Payment is 50 / 30 / 20 of the contract total of ' + money(total) + '. Invoice 1 (50%) is the deposit. The factory order is not placed until Invoice 1 is paid in full. That deposit is non-refundable once the factory order is placed, except as required by law. Invoice 2 (30%) is a progress payment as the order proceeds. Invoice 3 (20%) is due at pickup or delivery. Goods do not leave Seller until paid in full. Colorado sales tax applies as required.</p>'
    + '<h2>Measurements and Elevations</h2>'
    + '<p>Buyer owns measurements, quantities, layouts, and specs. Manufacturer elevation views ship with the Quote. Buyer verifies them against the job. Providing elevations does not make Seller the designer, the measurer, or a warrantor of fit. Order from a bad elevation is Buyer cost, including reorder, restocking, and freight.</p>'
    + '<h2>Delivery, Inspection, and Assembly</h2>'
    + '<p>Buyer inspects at pickup or delivery and notes visible damage on the ticket. Failure to note damage within 48 hours means the Goods are deemed accepted, except for hidden defects. Risk of loss passes on pickup or delivery. Title passes when paid in full.</p>'
    + '<p>Seller assembly is included in this contract total. It is assembly of the goods only, not installation into the building.</p>'
    + '<h2>Warranty</h2>'
    + '<p>Seller warrants the goods for one year from purchase. Claims go to Fremont Makers. This is Seller’s warranty, not a pass-through to the manufacturer or a home builder.</p>'
    + '<p class="fine">Colorado law. Binding arbitration in Fremont County, one arbitrator. Small claims if the amount fits. If arbitration is unavailable, venue is the state courts of Fremont County.</p>'
    + '<div class="sig"><div>'
    + '<div class="sig-line">Buyer signature</div>'
    + '<div class="sig-line">Printed name' + (signer ? ' · ' + esc(signer) : '') + '</div>'
    + '<div class="sig-line">Date</div>'
    + '</div><div>'
    + '<div class="sig-line">Fremont Makers LLC · signature</div>'
    + '<div class="sig-line">Printed name</div>'
    + '<div class="sig-line">Date</div>'
    + '</div></div></div>';
}
function pageSchedule(q, nums) {
  const total = nums.unit * modelQty(q);
  const ar = q.ar || {};
  const a1 = invAmt(ar, total, 1, 0.5);
  const a2 = invAmt(ar, total, 2, 0.3);
  const a3 = invAmt(ar, total, 3, 0.2);
  const rows = [
    ['Invoice 1 · 50% deposit', 'Factory order is not placed until this invoice is paid in full.', ar.d1Due, a1, ar.d1Paid],
    ['Invoice 2 · 30% progress', 'Progress payment as the order proceeds.', ar.d2Due, a2, ar.d2Paid],
    ['Invoice 3 · 20% pickup or delivery', 'Due at pickup or delivery.', ar.d3Due, a3, ar.d3Paid]
  ];
  const tr = rows.map(r => '<tr><td>' + esc(r[0]) + '<div class="fine">' + esc(r[1]) + '</div></td><td>' + esc(prettyDate(r[2])) + '</td><td class="r">' + money(r[3]) + (r[4] ? ' · PAID' : '') + '</td></tr>').join('');
  return '<div class="page">' + head('Payment Schedule')
    + '<h1>Payment Schedule</h1><div class="tag">making freedom</div>'
    + jobMeta(q, nums)
    + '<table><thead><tr><th>Invoice</th><th>Due</th><th class="r">Amount</th></tr></thead><tbody>'
    + tr
    + '<tr><td><strong>Contract total</strong></td><td></td><td class="r"><strong>' + money(total) + '</strong></td></tr>'
    + '</tbody></table>'
    + '<p class="note">Assembly is included. Install into the building is not.</p>'
    + '</div>';
}
function pageInvoice(q, nums, n) {
  const total = nums.unit * modelQty(q);
  const ar = q.ar || {};
  const spec = {
    1: { pct: 0.5, due: ar.d1Due, paid: ar.d1Paid, paidAt: ar.d1PaidAt, check: ar.d1Check, title: 'Invoice 1', sub: '50% deposit', note: 'The factory order is not placed until this invoice is paid in full. Once the factory order is placed, this deposit is non-refundable except as required by law.' },
    2: { pct: 0.3, due: ar.d2Due, paid: ar.d2Paid, paidAt: ar.d2PaidAt, check: ar.d2Check, title: 'Invoice 2', sub: '30% progress payment', note: 'Progress payment as the order proceeds.' },
    3: { pct: 0.2, due: ar.d3Due, paid: ar.d3Paid, paidAt: ar.d3PaidAt, check: ar.d3Check, title: 'Invoice 3', sub: '20% pickup or delivery', note: 'Due at pickup or delivery. Goods do not leave until paid in full.' }
  }[n];
  const amt = invAmt(ar, total, n, spec.pct);
  return '<div class="page">' + (spec.paid ? '<div class="paid">PAID</div>' : '')
    + head(spec.title)
    + '<h1>' + spec.title + '</h1><div class="tag">' + spec.sub + '</div>'
    + jobMeta(q, nums)
    + '<table><tbody>'
    + '<tr><td>Contract total</td><td class="r">' + money(total) + '</td></tr>'
    + '<tr><td>' + esc(spec.sub) + '</td><td class="r">' + money(amt) + '</td></tr>'
    + '<tr><td>Due</td><td class="r">' + esc(prettyDate(spec.due)) + '</td></tr>'
    + (spec.paid ? '<tr><td>Paid</td><td class="r">' + esc(prettyDate(spec.paidAt) || 'Yes') + (spec.check ? ' · Check ' + esc(spec.check) : '') + '</td></tr>' : '')
    + '<tr><td><strong>Amount due this invoice</strong></td><td class="r"><strong>' + money(spec.paid ? 0 : amt) + '</strong></td></tr>'
    + '</tbody></table>'
    + '<p class="note">' + esc(spec.note) + '</p>'
    + '<p class="fine">Please make payment to Fremont Makers LLC. Job ' + esc(q.jobCode || '') + '.</p>'
    + '</div>';
}
function pageQuote(q, nums) {
  const qtyM = modelQty(q);
  const cabRows = (q.cabinets || []).filter(c => (parseFloat(c.cost)||0) > 0 || (c.desc || '').trim())
    .map(c => {
      const qty = parseFloat(c.qty) || 0;
      const cost = parseFloat(c.cost) || 0;
      const markup = parseFloat(c.markup) || 0;
      const unit = cost * (1 + markup/100);
      return '<tr><td>' + esc(c.desc || '') + '</td><td>' + esc(c.serial || '') + '</td><td class="r">' + qty + '</td><td class="r">' + money(unit) + '</td><td class="r">' + money(qty * unit) + '</td></tr>';
    }).join('');
  const bulkRow = nums.bulkDisc > 0
    ? '<tr><td>Mfr. bulk discount (' + nums.bulkDisc + '%)</td><td class="r">−' + money(nums.cabNet * nums.bulkDisc/100) + '</td></tr>'
    : '';
  return '<div class="page">' + head('Final Job Quote')
    + '<h1>Final Job Quote</h1><div class="tag">making freedom</div>'
    + jobMeta(q, nums)
    + '<h2>Cabinets</h2>'
    + '<table><thead><tr><th>Description</th><th>SKU</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Total</th></tr></thead><tbody>'
    + (cabRows || '<tr><td colspan="5">No cabinets</td></tr>')
    + '</tbody></table>'
    + '<table class="tot"><tbody>'
    + '<tr><td>Cabinets</td><td class="r">' + money(nums.cabSell) + '</td></tr>'
    + bulkRow
    + '<tr><td>Assembly labor</td><td class="r">' + money(nums.laborCost) + '</td></tr>'
    + '<tr><td>G&A (' + nums.gnaPct + '%)</td><td class="r">' + money(nums.gna) + '</td></tr>'
    + '<tr><td>Tax (' + nums.taxPct + '% on product)</td><td class="r">' + money(nums.tax) + '</td></tr>'
    + '<tr><td>Job total' + (qtyM > 1 ? ' · ' + qtyM + ' houses' : '') + '</td><td class="r">' + money(nums.unit * qtyM) + '</td></tr>'
    + '</tbody></table>'
    + '<p class="note">G&A prints before tax. Tax is on product only and does not stack on G&A. Assembly is included.</p>'
    + '</div>';
}
function render(q, data) {
  const kids = childrenOf(q, data || {});
  const isOrder = q.kind === 'order' || q.isOrder;
  const total = isOrder ? orderTotal(q, kids) : (quoteGrand(q).unit * modelQty(q));
  const nums = isOrder ? Object.assign({}, quoteGrand(q), { unit: total }) : quoteGrand(q);
  if (isOrder) {
    q = Object.assign({}, q, { project: mixLabel(kids), modelQty: 1 });
  }
  const root = document.getElementById('root');
  const inv = MODE.invoice;
  const rec = MODE.receipt;
  let html = '';
  if (rec === 'd1' || inv === 1) html = pageInvoice(q, nums, 1);
  else if (rec === 'd2' || inv === 2) html = pageInvoice(q, nums, 2);
  else if (rec === 'd3' || inv === 3) html = pageInvoice(q, nums, 3);
  else if (isOrder) {
    html = pageOrderCover(q, kids, total)
      + pageAgreement(q, nums) + pageSchedule(q, nums)
      + pageInvoice(q, nums, 1) + pageInvoice(q, nums, 2) + pageInvoice(q, nums, 3)
      + kids.map(c => pageQuoteExhibit(c)).join('');
  } else {
    html = pageAgreement(q, nums) + pageSchedule(q, nums)
      + pageInvoice(q, nums, 1) + pageInvoice(q, nums, 2) + pageInvoice(q, nums, 3)
      + pageQuote(q, nums);
  }
  root.innerHTML = html;
  document.title = (q.jobCode || 'FM') + ' · ' + (q.customer || 'Contract packet');
}

async function boot() {
  const params = qs();
  MODE = { invoice: params.invoice, receipt: params.receipt };
  const msg = document.getElementById('load-msg');
  if (!params.id) {
    msg.className = 'err';
    msg.textContent = 'Open this packet from Project Builder (Open contract packet) so it can load the job.';
    return;
  }
  try {
    const res = await fetch(CLOUD, { cache: 'no-store' });
    const body = await res.json();
    const data = body.data || {};
    let q = parseQ(data['fm-quote-' + params.id]);
    if (q && q.parentOrderId) q = parseQ(data['fm-quote-' + q.parentOrderId]) || q;
    if (!q || !q.id) {
      msg.className = 'err';
      msg.textContent = 'That job is not in the cloud yet. Open Project Builder, wait for it to save, then open the packet again.';
      return;
    }
    Q = q;
    render(q, data);
  } catch (e) {
    msg.className = 'err';
    msg.textContent = 'Could not load the quote. Check the network and try again.';
  }
}
