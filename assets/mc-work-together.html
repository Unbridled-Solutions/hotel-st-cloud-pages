<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Our Work Together · Unbridled</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe6;
      --navy: #ffffff;
      --navy2: #ece6db;
      --card: #ffffff;
      --section: #ffffff;
      --blue: #1a3d52;
      --gold: #8a6a32;
      --text: #12202b;
      --muted: #3d4f5c;
      --border: rgba(18,32,43,0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    .deck {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    header.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: #ffffff;
      border-bottom: 2px solid rgba(18,32,43,0.18);
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img { width: 28px; height: auto; opacity: 1; filter: invert(1) brightness(0.18); }
    .brand span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue);
    }
    .dots { display: flex; gap: 8px; align-items: center; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid #8a6a32;
      background: transparent;
      cursor: pointer;
    }
    .dot.on { background: #8a6a32; }
    .hint {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .home-btn {
      background: #8a6a32;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .home-btn:disabled { opacity: 0.35; cursor: default; }
    .right-tools { display: flex; align-items: center; gap: 12px; }
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .viewer {
      display: none;
      position: absolute;
      inset: 0;
      background: #f4efe6;
      z-index: 20;
      flex-direction: column;
    }
    .viewer.on { display: flex; }
    .viewer iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: var(--bg);
    }
    .slide {
      position: absolute;
      inset: 0;
      padding: clamp(28px, 6vh, 56px) clamp(28px, 6vw, 80px);
      display: none;
      flex-direction: column;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
    }
    .slide.on { display: flex; }
    .kicker {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(32px, 5.4vw, 56px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 18px;
    }
    h1 em { font-style: normal; color: var(--gold); }
    .lede {
      font-size: clamp(17px, 2.1vw, 22px);
      line-height: 1.45;
      color: var(--text);
      max-width: 38em;
      margin-bottom: 22px;
    }
    .service {
      background: #ffffff;
      border: 1px solid rgba(18,32,43,0.18);
      border-left: 5px solid #8a6a32;
      border-radius: 0 10px 10px 0;
      padding: 16px 20px;
      max-width: 40em;
      margin-bottom: 28px;
    }
    .service .lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .service p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
    }
    .say {
      font-size: 15px;
      color: var(--muted);
      max-width: 40em;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #8a6a32;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn.ghost {
      background: #ffffff;
      color: #12202b;
      border: 2px solid #12202b;
    }
    .btn.small { font-size: 13px; padding: 9px 14px; font-weight: 700; }
    footer.nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px 16px;
      border-top: 2px solid rgba(18,32,43,0.18);
      background: #ffffff;
      flex-shrink: 0;
    }
    footer.nav button {
      background: #12202b;
      color: #ffffff;
      border: 1px solid #12202b;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    footer.nav button:disabled { opacity: 0.35; cursor: default; }
    .count {
      font-family: "Space Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .four {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 720px;
      margin: 8px 0 24px;
    }
    .ad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 720px;
      margin: 0 0 20px;
    }
    .ad-link {
      display: block;
      background: #ffffff;
      border: 2px solid rgba(18,32,43,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
    }
    .ad-link:hover { border-color: var(--gold); }
    .ad-link b { display: block; color: var(--gold); font-size: 13px; margin-bottom: 3px; }
    .ad-link span { font-size: 13px; color: var(--muted); }
    .chip {
      background: #ffffff;
      border: 2px solid rgba(18,32,43,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .chip b { display: block; color: var(--gold); font-size: 13px; margin-bottom: 3px; }
    .chip span { font-size: 13px; color: var(--muted); }
    @media (max-width: 700px) {
      .four { grid-template-columns: 1fr; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <header class="bar">
      <div class="brand">
        <img src="logos/unbridled-elk-icon-white.png" alt="" />
        <span>Unbridled · Our work together</span>
      </div>
      <div class="dots" id="dots"></div>
      <div class="right-tools">
        <div class="hint">Arrow keys · live tools stay here · Home always works</div>
        <button type="button" class="home-btn" id="homeTop">Home</button>
      </div>
    </header>

    <main id="main">
      <div class="viewer" id="viewer">
        <iframe id="viewFrame" title="Live tool"></iframe>
      </div>
    </main>

    <footer class="nav">
      <button type="button" id="prev">← Back</button>
      <div class="count" id="count"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" id="home">Home</button>
        <button type="button" id="next">Next →</button>
      </div>
    </footer>
  </div>

  <script>
    const slides = [
      {
        kicker: "Team briefing",
        title: "What we actually <em>built</em>",
        lede: "Not a demo deck. Live tools we use. I will tell you what each one does, then we will open it.",
        service: null,
        say: "Org, labor, ads, quote builder. Then the wedding or The Unbridled Way, depending on the room.",
        chips: [
          { n: 1, name: "The system", note: "Who does what" },
          { n: 2, name: "The daily op", note: "Labor against revenue" },
          { n: 3, name: "The growth engine", note: "Ads and the copy" },
          { n: 4, name: "Game day", note: "Fremont Makers quotes" },
          { n: 5, name: "The human one", note: "A wedding two people share" },
          { n: 6, name: "The book", note: "The Unbridled Way" }
        ]
      },
      {
        kicker: "01  ·  The system",
        title: "The <em>AI organization</em>",
        lede: "This is the machine. One orchestrator. Named specialists by business unit. Dedicated agents where people need a direct line.",
        service: "Shows the room who is live, who is planned, and how work moves: people to MC, through intake, to a specialist, then out the door. Design before build. MC reviews anything that ships.",
        say: "Say this: we did not hire a chatbot. We staffed an organization.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/unbridled-ai-org", label: "Open the org chart" }
        ]
      },
      {
        kicker: "02  ·  The daily operation",
        title: "Hotel St. Cloud <em>labor planner</em>",
        lede: "This is the unglamorous work. Forecast the week. Staff against it. Then put actuals next to the plan so nobody is guessing.",
        service: "Weekly labor against revenue for Hotel St. Cloud. Forecast, target labor percent, actuals, variance, and a four-week moving average. The thing a GM opens on Monday.",
        say: "Say this: if we can run a hotel week in the open, we can run the rest of the companies the same way.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/hsc-labor-planner", label: "Open the labor planner" }
        ]
      },
      {
        kicker: "03  ·  The growth engine",
        title: "Ads, live, with <em>the results</em>",
        lede: "This is the working marketing tool. Campaigns, spend, and what came back. Then the four ads we actually wrote.",
        service: "Live dashboard first. Then open any campaign to show the headlines and descriptions as they run.",
        say: "Dashboard for results. The four buttons below are the copy.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/live-dashboard", label: "Open the live ads dashboard" },
          { href: "https://offers.hotelstcloud.com/assets/portfolio-summary-may-jun-2026", label: "May–June summary", ghost: true }
        ],
        ads: [
          { href: "https://offers.hotelstcloud.com/assets/bars-bathrooms-ad-preview", label: "Local Proximity / Road trip", note: "Pull over. You've earned this." },
          { href: "https://offers.hotelstcloud.com/assets/basecamp-ad-preview", label: "Royal Gorge Basecamp", note: "You came for the gorge." },
          { href: "https://offers.hotelstcloud.com/assets/fp-sports-ad-preview", label: "FP Sports Bar", note: "Trail's done. Game's on." },
          { href: "https://offers.hotelstcloud.com/assets/standard-oil-ad-preview", label: "Standard Oil Coffee", note: "Fuel changed. Standard hasn't." }
        ]
      },
      {
        kicker: "04  ·  Game day",
        title: "Fremont Makers <em>quote builder</em>",
        lede: "A real shop tool. Price a cabinet job in front of them. This is the one that shows we do work, not just decks.",
        service: "Cloud quote builder for Fremont Makers. Labor, tax, markup, vendor invoices. The thing the shop actually uses, not a mockup.",
        say: "Say this: this is how a cabinet shop quotes without a spreadsheet fight.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/fremont-makers-quote", label: "Open the quote builder" }
        ]
      },
      {
        kicker: "05  ·  The human one",
        title: "Reili and Chris, <em>shared</em>",
        lede: "The first four say we can run a company. This one says we can build something two people actually use together.",
        service: "Shared wedding planner for Reili Bullis and Chris Taplin. Cloud-synced. Stan and Reili can both work it. Budget, decisions, the list. No version fight.",
        say: "Say this: Doing Good by Doing Well is not a poster. Sometimes it is a wedding. Skip this if the room is wrong.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/reili-wedding", label: "Open the wedding planner" }
        ]
      },
      {
        kicker: "06  ·  The book",
        title: "The <em>Unbridled Way</em>",
        lede: "This is the why. The operating philosophy, written down. Doing Good by Doing Well is not a poster. It is a book.",
        service: "The Unbridled Way, starting at the table of contents. Open a chapter from there if you have time.",
        say: "Say this: the tools prove we can build. The book proves we know why.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/unbridled-way-toc", label: "Open the table of contents" }
        ]
      },
      {
        kicker: "If they ask what else",
        title: "Stop here. <em>Then</em> the catalog.",
        lede: "Do not put the catalog in the four. If someone wants the rest of the pile, this is the door.",
        service: "Master Deliverables is the living list of what we have shipped. Open it only if the room asks.",
        say: "Thank them. Offer the catalog. Sit down.",
        links: [
          { href: "https://offers.hotelstcloud.com/assets/master-deliverables", label: "Open master deliverables", ghost: true }
        ]
      }
    ];

    let i = 0;
    const main = document.getElementById("main");
    const dots = document.getElementById("dots");
    const count = document.getElementById("count");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    slides.forEach((s, n) => {
      const el = document.createElement("section");
      el.className = "slide" + (n === 0 ? " on" : "");
      el.dataset.i = n;
      let html = `<div class="kicker">${s.kicker}</div><h1>${s.title}</h1><p class="lede">${s.lede}</p>`;
      if (s.chips) {
        html += `<div class="four">` + s.chips.map(c =>
          `<div class="chip" data-go="${c.n}"><b>0${c.n}  ${c.name}</b><span>${c.note}</span></div>`
        ).join("") + `</div>`;
      }
      if (s.service) {
        html += `<div class="service"><div class="lbl">What it does</div><p>${s.service}</p></div>`;
      }
      if (s.say) html += `<p class="say">${s.say}</p>`;
      if (s.ads) {
        html += `<div class="ad-grid">` + s.ads.map(a =>
          `<a class="ad-link" href="${a.href}" data-open="${a.href}"><b>${a.label}</b><span>${a.note}</span></a>`
        ).join("") + `</div>`;
      }
      if (s.links) {
        html += `<div class="actions">` + s.links.map(l =>
          `<a class="btn${l.ghost ? " ghost small" : ""}" href="${l.href}" data-open="${l.href}">${l.label} ↗</a>`
        ).join("") + `</div>`;
      }
      el.innerHTML = html;
      main.appendChild(el);

      const d = document.createElement("button");
      d.className = "dot" + (n === 0 ? " on" : "");
      d.type = "button";
      d.title = "Slide " + (n + 1);
      d.addEventListener("click", () => go(n));
      dots.appendChild(d);
    });

    const viewer = document.getElementById("viewer");
    const viewFrame = document.getElementById("viewFrame");
    let viewing = false;

    function closeView() {
      viewing = false;
      viewer.classList.remove("on");
      viewFrame.src = "about:blank";
    }

    function openView(url) {
      viewing = true;
      viewFrame.src = url;
      viewer.classList.add("on");
      document.getElementById("home").disabled = false;
      document.getElementById("homeTop").disabled = false;
    }

    function home() {
      closeView();
      go(0);
    }

    function go(n) {
      closeView();
      i = Math.max(0, Math.min(slides.length - 1, n));
      document.querySelectorAll(".slide").forEach((el, k) => el.classList.toggle("on", k === i));
      document.querySelectorAll(".dot").forEach((el, k) => el.classList.toggle("on", k === i));
      count.textContent = (i + 1) + " / " + slides.length;
      prev.disabled = i === 0;
      next.disabled = i === slides.length - 1;
      document.getElementById("home").disabled = i === 0;
      document.getElementById("homeTop").disabled = i === 0;
    }

    prev.addEventListener("click", () => { if (viewing) closeView(); else go(i - 1); });
    next.addEventListener("click", () => { if (viewing) closeView(); else go(i + 1); });
    document.getElementById("home").addEventListener("click", home);
    document.getElementById("homeTop").addEventListener("click", home);
    main.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) {
        e.preventDefault();
        openView(open.getAttribute("data-open"));
        return;
      }
      const chip = e.target.closest("[data-go]");
      if (chip) go(Number(chip.dataset.go));
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && viewing) { e.preventDefault(); closeView(); return; }
      if (e.key === "Home") { e.preventDefault(); home(); return; }
      if (viewing) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
      if (e.key === "End") go(slides.length - 1);
      if (e.key >= "1" && e.key <= "8") go(Number(e.key) - 1);
    });
    go(0);
  </script>
</body>
</html>
