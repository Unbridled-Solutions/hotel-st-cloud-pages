    body { padding-bottom: 88px; }
    header.top {

      background: var(--navy);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
    }
    .brand { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .brand h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .brand h1 span { color: var(--gold); }
    .brand p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .clock { font-family: "Space Mono", monospace; font-size: 13px; color: var(--gold); text-align: right; }
    .search {
      margin-top: 10px; width: 100%;
      background: transparent; color: var(--text);
      border: none; border-bottom: 1px solid rgba(201,170,124,0.3);
      padding: 8px 2px; font-size: 15px;
    }
    .search:focus { outline: none; border-bottom-color: var(--gold); }
    nav.tabs {
      position: sticky; top: 96px; z-index: 30;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 8px 12px; background: var(--bg);
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    nav.tabs button {
      flex: 0 0 auto; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    nav.tabs button.on { background: var(--gold); color: #0f1923; border-color: var(--gold); }
    main { padding: 14px; max-width: 860px; margin: 0 auto; }
    .panel { display: none; }
    .panel.on { display: block; }
    .day-chip, .show-chip {
      display: inline-block; margin: 0 6px 8px 0;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 10px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .day-chip.on, .show-chip.on { border-color: var(--gold); color: var(--gold); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    }
    .card.now { border-left: 4px solid var(--gold); }
    .card.done { opacity: 0.45; }
    .when { font-family: "Space Mono", monospace; font-size: 12px; color: var(--gold); }
    .act { font-size: 15px; font-weight: 700; margin: 4px 0 2px; }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .cue-num { font-family: "Space Mono", monospace; font-size: 11px; color: var(--blue); }
    .cue-live { outline: 2px solid var(--gold); }
    .kicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); font-weight: 800; margin: 16px 0 8px; }
    .row2 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    a.tel { color: var(--gold); text-decoration: none; }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .empty { color: var(--muted); font-size: 14px; padding: 20px 4px; }
    footer.dock {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--section); border-top: 1px solid var(--border);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--muted);
    }
    .mark { background: var(--navy); color: var(--gold); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>

st 12, 2026 - Strike, Loadout", "items": [{"start": "08:00", "end": "17:00", "activity": "Crew Call", "loc": "Breakouts", "vendor": "", "support": "", "notes": ""}, {"start": "08:00", "end": "17:00", "activity": "Strike all breakout rooms", "loc": "Breakouts", "vendor": "", "support": "", "notes": ""}, {"start": "TBD", "end": "", "activity": "Meal Break (1 hr walk away)", "loc": "n/a", "vendor": "AES", "support": "UB", "notes": ""}, {"start": "17:00", "end": "", "activity": "Breakouts end for the day", "loc": "Breakouts", "vendor": "", "support": "", "notes": ""}]}, {"day": "Thursday, August 13, 2026 - Travel", "items": [{"start": "TBD", "end": "", "activity": "Breakout Crew Travel Day - At Leisure", "loc": "Breakouts", "vendor": "AES", "support": "UB", "notes": ""}]}]};
    const TABS = [
      ["now", "Now"],
      ["shows", "Shows"],
      ["loadin", "Load-in"],
      ["reh", "Rehearse"],
      ["hm", "H&M"],
      ["team", "Team"],
      ["vendors", "Vendors"]
    ];
    const SHOW_KEYS = [
      ["sun_gs", "Sun GS"],
      ["mon_gs", "Mon GS"],
      ["tue_gs", "Tue GS"],
      ["fow", "FoW"],
      ["ceo", "CEO TH"],
      ["ai", "AI"]
    ];
    let tab = "now";
    let showKey = "mon_gs";
    let prodDay = 8; // Sunday Aug 9-ish index fallback
    let cueIdx = 0;
    let q = "";

    const tabsEl = document.getElementById("tabs");
    TABS.forEach(([id, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.dataset.tab = id;
      b.addEventListener("click", () => { tab = id; draw(); });
      tabsEl.appendChild(b);
    });

    function tick() {
      const n = new Date();
      document.getElementById("clock").innerHTML =
        n.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) +
        "<br><span style='color:#8a9aaa;font-size:10px'>" +
        n.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) + "</span>";
    }
    setInterval(tick, 15000); tick();

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({
        "&": "&",
        "<": "<",
        ">": ">",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }
    function hit(obj) {
      if (!q) return true;
      return JSON.stringify(obj).toLowerCase().includes(q);
    }
    function when(a,b) {
      if (a && b) return esc(a) + "–" + esc(b);
      return esc(a || b || "");
    }

    function draw() {
      tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
      const root = document.getElementById("main");
      if (tab === "now") root.innerHTML = viewNow();
      if (tab === "shows") root.innerHTML = viewShows();
      if (tab === "loadin") root.innerHTML = viewLoadin();
      if (tab === "reh") root.innerHTML = viewReh();
      if (tab === "hm") root.innerHTML = viewHM();
      if (tab === "team") root.innerHTML = viewTeam();
      if (tab === "vendors") root.innerHTML = viewVendors();
      bind();
    }

    function bind() {
      document.querySelectorAll("[data-prodday]").forEach(el => el.onclick = () => { prodDay = Number(el.dataset.prodday); draw(); });
      document.querySelectorAll("[data-show]").forEach(el => el.onclick = () => { showKey = el.dataset.show; cueIdx = 0; draw(); });
      document.querySelectorAll("[data-cue]").forEach(el => el.onclick = () => { cueIdx = Number(el.dataset.cue); draw(); });
    }

    function viewNow() {
      const days = DATA.prod;
      const chips = days.map((d,i) => `<button class="day-chip${i===prodDay?' on':''}" data-prodday="${i}">${esc(shortDay(d.day))}</button>`).join("");
      const day = days[prodDay] || days[0];
      const items = (day.items || []).filter(hit).slice(0, 18);
      const show = DATA.shows[guessShow(day.day)];
      let html = `<div class="kicker">Today on the floor</div>${chips}`;
      html += `<div class="card now"><div class="when">${esc(day.day)}</div>
        <div class="act">${items.length} call items</div>
        <div class="meta">Hall GH · 20ABC · Offline 29B · Office 29D</div></div>`;
      items.forEach(it => {
        html += itemCard(it);
      });
      if (show && show.cues.length) {
        html += `<div class="kicker">If you are in the room</div>
          <div class="card"><div class="act">${esc(show.title)}</div>
          <div class="meta">${esc(show.subtitle)}</div>
          <div class="note">Open Shows to run cues.</div></div>`;
      }
      return html;
    }

    function shortDay(s) {
      return String(s).replace(/,.*/, "").replace(" - ", " · ").replace("Presenter Rehearsals GS, ", "").slice(0, 36);
    }
    function guessShow(day) {
      if (/August 9|Sunday, August 9/.test(day)) return "sun_gs";
      if (/August 10/.test(day)) return "mon_gs";
      if (/August 11/.test(day)) return "tue_gs";
      return showKey;
    }

    function itemCard(it) {
      return `<div class="card">
        <div class="row2"><div class="when">${when(it.start,it.end)}</div><div class="meta">${esc(it.loc)}</div></div>
        <div class="act">${esc(it.activity)}</div>
        <div class="meta">${[it.vendor, it.support, it.notes].filter(Boolean).map(esc).join(" · ")}</div>
      </div>`;
    }

    function viewShows() {
      const chips = SHOW_KEYS.map(([k,l]) => `<button class="show-chip${k===showKey?' on':''}" data-show="${k}">${l}</button>`).join("");
      const s = DATA.shows[showKey];
      const cues = (s.cues || []).filter(hit);
      let html = `<div class="kicker">Cue caller</div>${chips}
        <div class="card now"><div class="act">${esc(s.title)}</div><div class="meta">${esc(s.subtitle)} · ${cues.length} cues</div></div>`;
      cues.forEach((c, i) => {
        const live = i === cueIdx ? " cue-live" : "";
        const done = i < cueIdx ? " done" : "";
        html += `<div class="card${live}${done}" data-cue="${i}">
          <div class="row2"><div class="cue-num">CUE ${esc(c.cue || (i+1))}</div><div class="when">${when(c.start,c.end)}${c.dur ? " · " + esc(c.dur) : ""}</div></div>
          <div class="act">${esc(c.event)}</div>
          <div class="meta">${[c.presenter && ("Presenter: " + c.presenter), c.screens, c.asset, c.audio, c.lights].filter(Boolean).map(esc).join(" · ")}</div>
          ${c.notes ? `<div class="note">${esc(c.notes)}</div>` : ""}
        </div>`;
      });
      return html;
    }

    function viewLoadin() {
      let html = `<div class="kicker">Production schedule</div>`;
      DATA.prod.forEach((d,i) => {
        const items = d.items.filter(hit);
        if (!items.length && q) return;
        html += `<div class="card"><div class="when">${esc(d.day)}</div><div class="act">${items.length} items</div></div>`;
        items.forEach(it => html += itemCard(it));
      });
      html += `<div class="kicker">Breakout rooms</div>`;
      DATA.breakouts.forEach(d => {
        const items = d.items.filter(hit);
        if (!items.length && q) return;
        html += `<div class="card"><div class="when">${esc(d.day)}</div></div>`;
        items.slice(0, 20).forEach(it => html += itemCard(it));
      });
      return html;
    }

    function viewReh() {
      let html = `<div class="kicker">Rehearsal blocks</div>`;
      DATA.reh.forEach(d => {
        html += `<div class="card now"><div class="act">${esc(d.day)}</div></div>`;
        d.onstage.filter(hit).forEach(it => {
          html += `<div class="card"><div class="when">${when(it.start,it.stop)}</div>
            <div class="act">${esc(it.session)}</div>
            <div class="meta">${[it.speaker, it.content].filter(Boolean).map(esc).join(" · ")}</div></div>`;
        });
        d.other.filter(hit).forEach(it => {
          html += `<div class="card"><div class="when">${when(it.start,it.stop)} · ${esc(it.room)}</div>
            <div class="act">${esc(it.session)}</div>
            <div class="meta">${[it.speaker, it.content].filter(Boolean).map(esc).join(" · ")}</div></div>`;
        });
      });
      return html;
    }

    function viewHM() {
      let html = `<div class="kicker">Hair and makeup</div>
        <div class="note">Arrive per notes. Mic immediately after service.</div>`;
      DATA.hm.forEach(sec => {
        html += `<div class="card now"><div class="act">${esc(sec.section)}</div></div>`;
        sec.slots.filter(hit).forEach(s => {
          html += `<div class="card">
            <div class="row2"><div class="when">${when(s.start,s.end)}</div><div class="meta">Stage ${esc(s.stage)} · ${esc(s.artist)}</div></div>
            <div class="act">${esc(s.name)}</div>
            <div class="meta">${esc(s.notes)}</div>
          </div>`;
        });
      });
      return html;
    }

    function viewTeam() {
      let html = `<div class="kicker">Show leads</div>`;
      DATA.leaders.filter(hit).forEach(p => {
        html += `<div class="card"><div class="act">${esc(p.name)}</div>
          <div class="meta">${esc(p.role)}${p.phone ? ' · <a class="tel" href="tel:'+esc(p.phone.replace(/[^\d+]/g,''))+'">'+esc(p.phone)+'</a>' : ""}</div></div>`;
      });
      html += `<div class="kicker">Names and titles</div>`;
      DATA.names.filter(hit).forEach(p => {
        html += `<div class="card"><div class="act">${esc(p.name)}</div><div class="meta">${esc(p.title)}</div></div>`;
      });
      html += `<div class="kicker">Comms</div>
        <div class="note">Wired vs wireless from the book. Channel map was last stamped 7.31.25. Confirm on site.</div>`;
      DATA.comm.filter(hit).forEach(p => {
        html += `<div class="card"><div class="row2"><div class="act">${esc(p.first)} ${esc(p.last)}</div><div class="when">${esc(p.com)}</div></div>
          <div class="meta">${esc(p.pos)} · ${esc(p.co)}</div></div>`;
      });
      return html;
    }

    function viewVendors() {
      let html = `<div class="kicker">Vendors</div>`;
      DATA.vendors.filter(hit).forEach(v => {
        const tel = (v.phone || "").replace(/[^\d+]/g, "");
        html += `<div class="card">
          <div class="act">${esc(v.name)}</div>
          <div class="meta">${esc(v.dept)}${v.contact ? " · " + esc(v.contact) : ""}</div>
          ${v.phone ? `<div class="note"><a class="tel" href="tel:${esc(tel)}">${esc(v.phone)}</a></div>` : ""}
        </div>`;
      });
      return html;
    }

    document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); draw(); });
    document.getElementById("mark").addEventListener("click", () => {
      if (tab !== "shows") { tab = "shows"; draw(); return; }
      const n = (DATA.shows[showKey].cues || []).length;
      cueIdx = Math.min(n - 1, cueIdx + 1);
      draw();
      const live = document.querySelector(".cue-live");
      if (live) live.scrollIntoView({block: "center"});
    });
    draw();
  </script>
</body>
</html>
